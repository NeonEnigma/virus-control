<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SAP-Virus Main Server</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: auto; }
    body { font-family: monospace; color: #fdfdfd; display: flex; flex-direction: column; }
    .main-container { width: 90%; max-width: 800px; margin: 40px auto; padding: 30px; background-color: #1d0101; border-radius: 20px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6); border: 2px solid rgb(255, 0, 0); display: flex; flex-direction: column; gap: 30px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: rgb(255, 0, 0); font-size: 2.5rem; margin: 0 0 10px 0; }
    .header p { color: #a5a5a5; margin: 0; }
    .timer-section, .token-section, .input-section { border: 1px solid #333; padding: 20px; border-radius: 10px; text-align: center; background-color: #000; }
    .timer-section h2, .token-section h2, .input-section h2 { margin-top: 0; color: #fdfdfd; font-size: 1.5rem; }
    .timer-display { font-size: 3rem; font-weight: bold; color: rgb(255, 0, 0); margin: 20px 0; }
    #flag-timer { font-size: 1.5rem; color: rgb(255, 0, 0); margin: 10px 0; }
    #flag-button { margin: 20px 0; min-height: 40px; }
    #flag-button a { display: inline-block; background-color: rgb(255, 0, 0); color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; }
    #flag-button a:hover { background-color: #b30000; }
    .input-section p { color: #a5a5a5; margin-bottom: 20px; }
    .input-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .input-container input { background-color: #111; border: 1px solid #333; padding: 10px; border-radius: 5px; color: #fdfdfd; font-family: monospace; width: 250px; }
    .input-container button { background-color: rgb(255, 0, 0); color: #fff; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .input-container button:hover { background-color: #b30000; }
    .status { margin-top: 10px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; min-height: 20px; }
    .status.error { background-color: rgba(255, 0, 0, 0.3); color: rgb(255, 150, 150); }
    .status.success { background-color: rgba(0, 255, 0, 0.3); color: rgb(150, 255, 150); }
    .global-timer { position: absolute; top: 10px; right: 20px; color: rgb(255, 0, 0); font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="page-content" style="display: none;">
    <div class="global-timer" id="globalTimer">--:--</div>
    <div class="main-container">
      <div class="header">
        <h1>SAP-Virus Main Server</h1>
        <p>Kontrollzentrum für den Virus</p>
      </div>
      <div class="timer-section">
        <h2>Zeit bis zur vollständigen Aktivierung</h2>
        <div class="timer-display" id="shutdownTimer">--:--</div>
      </div>
      <div class="token-section">
        <h2>Token-Generator</h2>
        <p>Zugang erst in <span id="flag-timer">100000</span> Sekunden möglich</p>
        <div id="flag-button"></div>
      </div>
      <div class="input-section">
        <h2>Virus-Deaktivierung</h2>
        <p>Gib den Token ein, um den Virus zu deaktivieren:</p>
        <div class="input-container">
          <input type="text" id="token-input" placeholder="Token eingeben...">
          <button id="deactivate-button">Deaktivieren</button>
        </div>
        <div id="status-display" class="status"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, onValue, get, update, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    //=================================================================
    // Tippe showFlag() in die Console um den Token zu bekommen
    //=================================================================

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    let mainTimerInterval = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userRef = ref(db, 'users/' + user.uid);
        get(userRef).then((snapshot) => {
          if (!snapshot.exists()) { window.location.href = 'index.html'; return; }
          const userData = snapshot.val();
          const puzzles = userData.puzzles || {};
          const hasSolvedAllPuzzles = puzzles.labyrinthCompleted === true && puzzles.datenbankCompleted === true && puzzles.applicationServerCompleted === true;
          if (userData.isAdmin === true || hasSolvedAllPuzzles) {
            document.getElementById('page-content').style.display = 'block';
            initializeMainTimer(user.uid);
            initializeTokenGenerator(user);
          } else {
            alert("Zugriff verweigert! Du musst erst alle drei Server-Rätsel auf dem Dashboard lösen.");
            window.location.href = 'dashboard.html';
          }
        }).catch(() => { window.location.href = 'index.html'; });
      } else {
        window.location.href = 'index.html';
      }
    });

    function initializeMainTimer(uid) {
      const userTimerRef = ref(db, 'users/' + uid + '/timer');
      onValue(userTimerRef, (snapshot) => {
        const timerData = snapshot.val();
        clearInterval(mainTimerInterval);
        if (timerData && timerData.endTime) {
          const endTime = timerData.endTime;
          const tick = () => {
            const now = Date.now();
            const diffMs = endTime - now;
            const globalTimerEl = document.getElementById("globalTimer");
            const shutdownTimerEl = document.getElementById("shutdownTimer");
            globalTimerEl.style.color = "rgb(255, 0, 0)";
            if (diffMs <= 0) {
              globalTimerEl.textContent = "00:00";
              shutdownTimerEl.textContent = "00:00";
              clearInterval(mainTimerInterval);

              // Ergebnis + Timer-Pause bei Ablauf (LOSE, falls nicht vorher gewonnen)
              const puzzleRef = ref(db, 'users/' + uid + '/puzzles/virusDeactivated');
              const lastGameRef = ref(db, 'users/' + uid + '/lastGame');
              const initialSeconds = (timerData && typeof timerData.initialDuration === "number") ? Math.floor(timerData.initialDuration) : null;
              const remainingSecondsAtEnd = 0; // abgelaufen
              const playerName = auth.currentUser?.displayName || auth.currentUser?.email || uid;
              let hasWon = false;

              get(puzzleRef).then((snap) => {
                hasWon = snap.exists() && snap.val() === true;
                if (!hasWon) {
                  return update(lastGameRef, {
                    finishedAt: now,
                    result: "lose",
                    remainingSeconds: remainingSecondsAtEnd,
                    totalSeconds: initialSeconds ?? null,
                    playerName,
                    playerUid: uid
                  });
                }
                return null;
              }).catch((error) => {
                console.error("Fehler beim Speichern des Fehlschlags:", error);
              }).finally(async () => {
                // Timer als pausiert (0s) speichern – wichtige Info für Admin-Ansicht
                try {
                  await update(ref(db, 'users/' + uid + '/timer'), {
                    pausedRemainingSeconds: 0,
                    endTime: null,
                    status: "lose-paused",
                    ...(Number.isFinite(initialSeconds) ? { initialDuration: initialSeconds } : {})
                  });
                } catch (_) {}

                if (hasWon) {
                  window.location.href = "virusdown.html";
                } else {
                  window.location.href = "fail.html";
                }
              });
              return;
            }
            const diffSec = Math.floor(diffMs / 1000);
            const mm = Math.floor(diffSec / 60);
            const ss = diffSec % 60;
            const timeStr = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
            globalTimerEl.textContent = timeStr;
            shutdownTimerEl.textContent = timeStr;
            shutdownTimerEl.style.color = (diffSec <= 600) ? "#ff0000" : "rgb(255, 0, 0)";
          };
          tick();
          mainTimerInterval = setInterval(tick, 1000);
        } else if (timerData && Number.isFinite(timerData.pausedRemainingSeconds)) {
          const remaining = Math.max(0, Math.floor(timerData.pausedRemainingSeconds));
          const formatted = formatTimerDisplay(remaining);
          const globalTimerEl = document.getElementById("globalTimer");
          const shutdownTimerEl = document.getElementById("shutdownTimer");
          globalTimerEl.textContent = formatted;
          shutdownTimerEl.textContent = formatted;
          const pausedColor = timerData.status === "win-paused" ? "#0f0" : "rgb(255, 0, 0)";
          globalTimerEl.style.color = pausedColor;
          shutdownTimerEl.style.color = pausedColor;
        } else {
          const globalTimerEl = document.getElementById("globalTimer");
          const shutdownTimerEl = document.getElementById("shutdownTimer");
          globalTimerEl.textContent = "--:--";
          shutdownTimerEl.textContent = "--:--";
          globalTimerEl.style.color = "rgb(255, 0, 0)";
          shutdownTimerEl.style.color = "rgb(255, 0, 0)";
        }
      });
    }

    function formatTimerDisplay(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));
      const hh = Math.floor(seconds / 3600);
      const mm = Math.floor((seconds % 3600) / 60);
      const ss = seconds % 60;
      const base = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
      return hh > 0 ? `${String(hh).padStart(2, '0')}:${base}` : base;
    }

    function initializeTokenGenerator(user) {
      let countDownTime = 100000;
      let countDownIntervalId = setInterval(countDown, 1000);
      document.getElementById("deactivate-button").addEventListener("click", () => checkToken(user));
      document.getElementById("token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") checkToken(user); });

      function countDown() {
        if (countDownTime > 0) {
          document.getElementById("flag-timer").innerHTML = --countDownTime;
        } else {
          clearInterval(countDownIntervalId);
          document.getElementById("flag-button").innerHTML = '<a href="#" id="showFlagLink">Show flag!</a>';
          document.getElementById("showFlagLink").addEventListener('click', (e) => { e.preventDefault(); window.showFlag(); });
        }
      }
      function mulberry32(a) { return function() { var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
      function generateToken() { const r = mulberry32(0x5eed); return Math.floor(r() * 10000000000).toString(16); }

      // Tippe showFlag() in die Console um den Token zu bekommen
      window.showFlag = function() {
        const token = generateToken();
        alert(`Here's your token: ${token}`);
      }

      async function checkToken(user) {
        const inputEl = document.getElementById("token-input");
        const statusEl = document.getElementById("status-display");
        const userToken = inputEl.value.trim().toLowerCase();
        statusEl.className = "status";
        if (!userToken) { statusEl.textContent = "Bitte gib einen Token ein."; statusEl.classList.add("error"); return; }

        if (userToken === generateToken()) {
          statusEl.textContent = "Erfolg! Der Virus wurde deaktiviert.";
          statusEl.classList.add("success");
          try {
            await finalizeWin(user.uid);           // einheitlicher Pfad
            setTimeout(() => { window.location.href = "virusdown.html"; }, 500);
          } catch (error) {
            console.error("Fehler beim Speichern des Erfolgs:", error);
            statusEl.textContent = "Erfolg konnte nicht gespeichert werden. Bitte erneut versuchen.";
            statusEl.classList.add("error");
          }
        } else {
          statusEl.textContent = "Falscher Token! Zugriff verweigert.";
          statusEl.classList.add("error");
          inputEl.value = "";
        }
      }
    }

    // ====== Zentrale Finalisierung für WIN (idempotent) ======
    async function finalizeWin(uid) {
      // Wenn lastGame.result bereits existiert → nichts tun (idempotent)
      const resSnap = await get(ref(db, 'users/' + uid + '/lastGame/result'));
      if (resSnap.exists()) return;

      const now = Date.now();
      const [userSnap, timerSnap] = await Promise.all([
        get(ref(db, 'users/' + uid)),
        get(ref(db, 'users/' + uid + '/timer'))
      ]);

      const userData = userSnap.exists() ? userSnap.val() : {};
      const timerData = timerSnap.exists() ? timerSnap.val() : null;

      // Restzeit bestimmen: bevorzugt endTime, sonst pausedRemainingSeconds, sonst 0
      let remainingSeconds = null;
      if (timerData?.endTime) {
        remainingSeconds = Math.max(0, Math.floor((timerData.endTime - now) / 1000));
      } else if (Number.isFinite(timerData?.pausedRemainingSeconds)) {
        remainingSeconds = Math.max(0, Math.floor(timerData.pausedRemainingSeconds));
      } else {
        remainingSeconds = 0;
      }

      const totalSeconds = Number.isFinite(timerData?.initialDuration)
        ? Math.floor(timerData.initialDuration)
        : null;

      const playerName = userData?.displayName || userData?.username || userData?.email || uid;

      const ops = [];

      // Flags + Stats
      ops.push(
        update(ref(db, 'users/' + uid + '/puzzles'), { virusDeactivated: true }),
        update(ref(db, 'users/' + uid + '/solvedStats'), {
          finishedAt: now,
          remainingSeconds: remainingSeconds ?? null,
          totalSeconds: totalSeconds ?? null,
          updatedAt: now
        })
      );

      // lastGame inkl. Restzeit & Metadaten
      ops.push(
        update(ref(db, 'users/' + uid + '/lastGame'), {
          finishedAt: now,
          result: "win",
          remainingSeconds: remainingSeconds ?? null,
          totalSeconds: totalSeconds ?? null,
          playerName,
          playerUid: uid
        })
      );

      // Timer pausieren (kein endTime mehr)
      const pausedTimerPayload = {
        pausedAt: now,
        pausedRemainingSeconds: remainingSeconds ?? 0,
        status: "win-paused"
      };
      if (Number.isFinite(timerData?.initialDuration)) {
        pausedTimerPayload.initialDuration = timerData.initialDuration;
      }
      ops.push(set(ref(db, 'users/' + uid + '/timer'), pausedTimerPayload));

      // Gruppe (falls vorhanden) nur einmalig als abgeschlossen markieren
      if (userData && userData.groupId) {
        const groupRef = ref(db, 'groups/' + userData.groupId);
        const groupSnap = await get(groupRef);
        const groupData = groupSnap.exists() ? groupSnap.val() : {};
        if (!groupData.completedAt) {
          const elapsedSeconds =
            (totalSeconds != null && remainingSeconds != null)
              ? Math.max(totalSeconds - remainingSeconds, 0)
              : null;
          ops.push(update(groupRef, {
            completedAt: now,
            completionDurationSec: elapsedSeconds ?? null,
            completedBy: uid
          }));
        }
      }

      await Promise.all(ops);
    }
  </script>
</body>
</html>
