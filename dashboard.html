<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Server-Verwaltung – Labyrinth Rätsel</title>
  <style>
    /* Ihr komplettes CSS bleibt hier unverändert. */
    .connected { color: #fff; border-radius: 100px; padding: 2px 6px; margin-left: 5px; font-weight: normal; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; }
    body { font-family: monospace; color: #fdfdfd; display: flex; flex-direction: column; }
    .active-btn { background-color: rgb(255, 0, 0); color: #000; cursor: pointer; padding: 10px 20px; border-radius: 6px; font-size: 1rem; font-weight: 600; border: none; margin-bottom: 15px; margin-top: 30px; transition: background-color 0.2s, transform 0.2s; }
    .active-btn:hover { background-color: rgb(206, 1, 1); transform: scale(1.02); }
    .dashboard { flex: 1; display: flex; flex-direction: column; }
    .heading { padding-left: 20px; padding-top: 20px; }
    .text { padding-left: 20px; padding-bottom: 20px; color: #a5a5a5; }
    .heading h1 { margin: 0; font-size: 2rem; font-weight: 600; letter-spacing: 1px; text-align: left; }
    .main-rows { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 0 20px 20px 20px; box-sizing: border-box; }
    .top-row { display: flex; flex-wrap: wrap; gap: 20px; box-sizing: border-box; }
    .bottom-row { display: flex; gap: 20px; box-sizing: border-box; align-items: flex-start; }
    .box { background-color: #1d0101; border-radius: 20px; padding: 20px; box-sizing: border-box; text-align: center; box-shadow: 0 4px 12px rgba(18, 1, 65, 0.3); transition: transform 0.2s, box-shadow 0.2s; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .box:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5); }
    .black-box { background-color: #000 !important; }
    .box h2, .box h1, .box p { margin: 0; }
    .box h2 { margin-bottom: 15px; }
    .server-status { font-size: 0.9rem; color: rgb(255, 0, 0); padding-bottom: 10px; }
    .server-status-main { font-size: 1.0rem; color: rgb(255, 0, 0); padding-bottom: 10px; }
    .connection-group-main { width: 80%; text-align: left; margin: 30px auto; padding-left: 90px; }
    .connection-group { width: 80%; text-align: left; margin: 30px auto; padding-left: 20px; }
    .main-server { color: rgb(255, 0, 0); text-align: left; font-size: 2rem; font-weight: 600; padding-bottom: 30px; }
    .square { width: 300px; height: 300px; flex: 0 0 auto; }
    .flex-grow { flex: 1; }
    .servers-box { width: 100%; height: 480px; max-height: 480px; overflow-y: auto; border: 1px solid #ccc; }
    .virus-box.square_bottom { width: 480px; height: 480px; flex-shrink: 0; border: 1px solid rgb(255, 0, 0); }
    .part { border: 1px solid rgb(255, 0, 0); }
    .part::before, .shutdown::before, .servers-box::before, .virus-box::before { content: ""; position: absolute; inset: 0; border-radius: 20px; pointer-events: none; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3); opacity: 0; transition: opacity 0.3s; }
    .part:hover::before, .shutdown:hover::before, .servers-box:hover::before, .virus-box:hover::before { opacity: 1; }
    .shutdown::before, .servers-box::before { box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
    .status-btn { background-color: rgb(255, 0, 0); color: #000; padding: 10px 20px; border-radius: 6px; font-size: 1rem; font-weight: 600; border: none; cursor: pointer; transition: background-color 0.2s, transform 0.2s; }
    .status-btn:hover { background-color: rgb(171, 21, 21); transform: scale(1.02); }
    .shutdown .title { color: rgb(255, 255, 255); font-weight: 500; margin-bottom: 8px; font-size: 3rem; letter-spacing: 0.5px; }
    .shutdown .timer { font-size: 7rem; font-weight: 600; }
    .label-vertical { position: absolute; top: 50%; left: 15px; transform: translate(0, -50%) rotate(-90deg); font-size: 1rem; font-weight: 600; white-space: nowrap; }
    .map { width: 75%; background-color: #444; border-radius: 8px; position: relative; overflow: hidden; }
    .virus-box h2 { margin-bottom: 15px; font-size: 1.1rem; font-weight: 500; }
    .deactivate-btn { background-color: #777; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 1rem; font-weight: 600; border: none; margin-bottom: 15px; margin-top: 30px; cursor: pointer; transition: background-color 0.2s, transform 0.2s; }
    .success { background-color: rgba(51, 172, 51, 0.318) !important; border-color: #0f0 !important; color: #0f0 !important; }
    .success .server-status { color: #0f0 !important; }
    .success .status-btn { background-color: #0f0 !important; }
    .success .status-btn:hover { background-color: #0a0 !important; }
  </style>
</head>
<body>

  <div id="page-content" style="display: none;"> <div class="dashboard">
      <div class="heading">
        <h1>Willkommen, John!</h1>
      </div>
      <div class="text">
        <p>Ver
