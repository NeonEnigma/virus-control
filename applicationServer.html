<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kosten</title>
  <style>/* CSS unverändert */ html,body{margin:0;padding:0;width:100%;height:100%;background-color:#000;font-family:monospace;color:#fdfdfd}.dashboard{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;position:relative;height:100%}.back-arrow{text-decoration:none;position:absolute;top:20px;left:20px;font-size:15px;color:#0f0;cursor:pointer;padding:10px;z-index:100;background-color:rgba(0,0,0,.5);border-radius:5px}.back-arrow:hover{background-color:rgba(0,255,0,.2)}.heading h1{font-size:2rem;margin-bottom:10px}.description{max-width:600px;text-align:left;margin-bottom:20px;line-height:1.5}.input-group{width:100%;max-width:600px;text-align:center}.input-group input{background-color:#222;color:#fdfdfd;border:1px solid #0f0;border-radius:5px;padding:5px;font-family:monospace;width:auto;text-align:center;margin-right:5px;height:25px}.input-group button{background-color:#0f0;color:#000;border:none;border-radius:7px;padding:10px;font-size:1rem;cursor:pointer;transition:background-color .2s;margin-top:10px}.input-group button:hover{background-color:#6f6}.error{color:red;font-size:1rem;min-height:1.2em;margin-top:10px}.success-container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background-color:#000;text-align:center}.success-icon{font-size:5rem;color:#0f0;margin-bottom:20px;animation:pulse 2s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}.success-title{color:#0f0;font-size:2.5rem;margin-bottom:15px}.success-message{color:#afa;font-size:1.5rem;margin-bottom:30px}.dashboard-btn{background-color:#0f0;color:#000;border:none;padding:12px 25px;border-radius:5px;font-size:1.2rem;cursor:pointer;text-decoration:none;transition:all .3s ease}.dashboard-btn:hover{background-color:#6f6;transform:scale(1.05);box-shadow:0 0 15px rgba(0,255,0,.5)}</style>
</head>
<body>
  
  <script type="module">
    import { api } from './js/api.js';

    function showSuccessPage() {
       document.body.innerHTML=`<div class="success-container"><div class="success-icon">✓</div><h1 class="success-title">Application Server ist online</h1><p class="success-message">Firewall aktiviert • Ports gesichert • System geschützt</p><a href="dashboard.html" class="dashboard-btn">Zurück zum Dashboard</a></div>`;
    }

    function showPuzzlePage(user) {
       document.body.innerHTML=`<div class="back-arrow" onclick="window.location.href='dashboard.html'">&#8592; Dashboard</div><div class="dashboard" id="dashboardContent"><div class="heading"><h1>Kostenplanung</h1></div><div class="description"><p>IT kostet, deshalb habe ich meine Aufwendungen zweier Jahre grafisch verglichen. Jetzt habe ich aber vergessen, wie hoch meine jährliche Grenze ist. Sowohl mein Budget als auch meine Fixkosten haben sich über die Jahre nicht verändert.</p><p>Wie hoch ist mein Budget?</p></div><img src="Applikation-Server.png" height="65%"><div class="input-group">Budget in Euro:<input type="text" id="budget" maxlength="10" placeholder="€" required pattern="[0-9]+"><button id="solutionButton">Lösung prüfen</button><p class="error" id="errorDisplay"></p></div></div>`;
       initializePuzzle(user);
    }

    async function init() {
        try {
            const user = await api.getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const puzzles = user.puzzles || {};
            // Access control
            if (user.isAdmin || puzzles.terminalCompleted) {
                if (puzzles.applicationServerCompleted) {
                    showSuccessPage();
                } else {
                    showPuzzlePage(user);
                }
            } else {
                alert("Zugriff verweigert! Du musst zuerst das Terminal-Rätsel lösen.");
                window.location.href = 'terminal.html';
            }
        } catch (e) {
            console.error("Auth check failed", e);
            window.location.href = 'index.html';
        }
    }

    function initializePuzzle(user) {
        document.getElementById("solutionButton").addEventListener("click", () => {
            let t = document.getElementById("budget").value;
            if (["150k", "150k€", "150000", "150000€"].includes(t.toLowerCase().trim())) {
                api.request('/game/puzzles', 'PUT', { applicationServerCompleted: true })
                   .then(() => {
                       console.log("Application-Server-Rätsel-Status gespeichert!");
                       showSuccessPage();
                   })
                   .catch(err => {
                       const el = document.getElementById("errorDisplay");
                       el.textContent = "Fehler beim Speichern!";
                   });
            } else {
                const el = document.getElementById("errorDisplay");
                el.textContent = "Falsche Lösung! Bitte überprüfe deine Eingabe.";
                setTimeout(() => { el.textContent = "" }, 3000);
            }
        });
    }

    init();
  </script>
</body>
</html>
