<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letzte Spiele</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: #0f0;
      font-family: "Lucida Console", Monaco, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .overview-card {
      width: 100%;
      max-width: 960px;
      border: 2px solid #0f0;
      border-radius: 8px;
      background-color: #050505;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: #0f0;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
      text-align: center;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: #bbb;
      text-align: center;
      font-size: 1rem;
    }

    #status-message {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 0, 0.4);
      background-color: rgba(0, 255, 0, 0.05);
      color: #0ff;
      font-size: 0.95rem;
    }

    #status-message.error {
      border-color: rgba(255, 0, 0, 0.5);
      color: #f66;
      background-color: rgba(255, 0, 0, 0.08);
    }

    .last-games {
      border: 1px solid rgba(0, 255, 0, 0.3);
      border-radius: 6px;
      overflow: hidden;
    }

    .last-game-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1fr 1.5fr;
      gap: 12px;
      padding: 12px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 0, 0.15);
      font-size: 0.95rem;
    }

    .last-game-header {
      font-weight: bold;
      background: rgba(0, 255, 0, 0.08);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0ff;
    }

    .last-game-row:last-child {
      border-bottom: none;
    }

    .result-win {
      color: #0f0;
      font-weight: bold;
    }

    .result-lose {
      color: #f66;
      font-weight: bold;
    }

    .duration-win {
      color: #0f0;
      font-weight: bold;
    }

    .duration-lose {
      color: #f66;
      font-weight: bold;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: #777;
      font-size: 0.95rem;
    }

    @media (max-width: 800px) {
      .last-game-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "player player"
          "group group"
          "duration result"
          "date date";
      }
      .col-player { grid-area: player; }
      .col-group { grid-area: group; }
      .col-duration { grid-area: duration; }
      .col-result { grid-area: result; }
      .col-date { grid-area: date; text-align: left; }
    }
  </style>
</head>
<body>
