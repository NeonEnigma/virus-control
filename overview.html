<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letzte Spiele</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: #0f0;
      font-family: "Lucida Console", Monaco, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .overview-card {
      width: 100%;
      max-width: 960px;
      border: 2px solid #0f0;
      border-radius: 8px;
      background-color: #050505;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: #0f0;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
      text-align: center;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: #bbb;
      text-align: center;
      font-size: 1rem;
    }

    #status-message {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 0, 0.4);
      background-color: rgba(0, 255, 0, 0.05);
      color: #0ff;
      font-size: 0.95rem;
    }

    #status-message.error {
      border-color: rgba(255, 0, 0, 0.5);
      color: #f66;
      background-color: rgba(255, 0, 0, 0.08);
    }

    .last-games {
      border: 1px solid rgba(0, 255, 0, 0.3);
      border-radius: 6px;
      overflow: hidden;
    }

    .last-game-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1fr 1.5fr;
      gap: 12px;
      padding: 12px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 0, 0.15);
      font-size: 0.95rem;
    }

    .last-game-header {
      font-weight: bold;
      background: rgba(0, 255, 0, 0.08);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0ff;
    }

    .last-game-row:last-child {
      border-bottom: none;
    }

    .result-win {
      color: #0f0;
      font-weight: bold;
    }

    .result-lose {
      color: #f66;
      font-weight: bold;
    }

    .duration-win {
      color: #0f0;
      font-weight: bold;
    }

    .duration-lose {
      color: #f66;
      font-weight: bold;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: #777;
      font-size: 0.95rem;
    }

    @media (max-width: 800px) {
      .last-game-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "player player"
          "group group"
          "duration result"
          "date date";
      }
      .col-player { grid-area: player; }
      .col-group { grid-area: group; }
      .col-duration { grid-area: duration; }
      .col-result { grid-area: result; }
      .col-date { grid-area: date; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="overview-card">
    <h1>Letzte Spiele</h1>
    <div id="status-message" role="status" aria-live="polite">Lade Daten...</div>
    <div id="last-games" class="last-games"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const MAX_ENTRIES = 20;
    const statusEl = document.getElementById("status-message");
    const listEl = document.getElementById("last-games");

    function setStatus(message, isError = false) {
      if (!statusEl) return;
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(isError));
      statusEl.style.display = message ? "block" : "none";
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return map[char] || char;
      });
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "";
      const totalSeconds = Math.floor(seconds);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const minutesText = String(minutes).padStart(2, "0");
      const secondsText = String(secs).padStart(2, "0");
      const mmss = minutesText + ":" + secondsText;
      if (hours > 0) {
        const hoursText = String(hours).padStart(2, "0");
        return hoursText + ":" + mmss;
      }
      return mmss;
    }

    function formatTimestamp(timestamp) {
      if (!Number.isFinite(timestamp) || timestamp <= 0) return "";
      try {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString("de-DE");
      } catch (error) {
        return "";
      }
    }

    function parsePublicEntries(data) {
      if (!data) return [];
      if (data.status && typeof data.status === "string") {
        try {
          const parsed = JSON.parse(data.status);
          if (Array.isArray(parsed)) return parsed;
        } catch (error) {
          console.warn("Konnte öffentliche Übersicht nicht parsen:", error);
        }
      }
      return [];
    }

    function sanitizeEntries(rawEntries) {
      if (!Array.isArray(rawEntries)) return [];
      return rawEntries.map((entry) => {
        const player = typeof entry.player === "string" ? entry.player : "";
        const group = typeof entry.group === "string" ? entry.group : "Keine Gruppe";
        const result = typeof entry.result === "string" ? entry.result : "unknown";
        const remainingSecondsValue = Number(entry.remainingSeconds);
        const totalSecondsValue = Number(entry.totalSeconds);
        const finishedAtValue = Number(entry.finishedAt);
        let remainingSeconds = Number.isFinite(remainingSecondsValue)
          ? Math.max(0, remainingSecondsValue)
          : null;
        const totalSeconds = Number.isFinite(totalSecondsValue) ? Math.max(0, totalSecondsValue) : null;
        if (result === "lose") remainingSeconds = 0;
        else if (remainingSeconds === null && totalSeconds !== null && result === "win") {
          remainingSeconds = totalSeconds;
        }
        return {
          player,
          group,
          result,
          remainingSeconds,
          totalSeconds,
          finishedAt: Number.isFinite(finishedAtValue) ? finishedAtValue : 0
        };
      });
    }

    function renderLastGames(entries) {
      if (!listEl) return;

      if (!Array.isArray(entries) || !entries.length) {
        listEl.innerHTML = '<div class="empty-state">Noch keine freigegebenen Spiele.</div>';
        setStatus("");
        return;
      }

      entries.sort((a, b) => {
        const remainingA = Number.isFinite(a.remainingSeconds) ? a.remainingSeconds : (a.result === "lose" ? 0 : -1);
        const remainingB = Number.isFinite(b.remainingSeconds) ? b.remainingSeconds : (b.result === "lose" ? 0 : -1);
        if (remainingA !== remainingB) return remainingB - remainingA;
        return (b.finishedAt || 0) - (a.finishedAt || 0);
      });
      const topEntries = entries.slice(0, MAX_ENTRIES);

      const rows = [
        '<div class="last-game-row last-game-header">' +
          '<span class="col-player">Spieler</span>' +
          '<span class="col-group">Gruppe</span>' +
          '<span class="col-duration">Restzeit</span>' +
          '<span class="col-result">Ergebnis</span>' +
          '<span class="col-date">Beendet am</span>' +
        '</div>'
      ];

      for (const entry of topEntries) {
        const groupName = entry.group || "Keine Gruppe";
        const durationValue = (() => {
          if (entry.result === "lose") return "00:00";
          if (Number.isFinite(entry.remainingSeconds)) return formatDuration(entry.remainingSeconds);
          return "—";
        })();
        const durationClasses = ["col-duration"];
        if (entry.result === "win") durationClasses.push("duration-win");
        else if (entry.result === "lose") durationClasses.push("duration-lose");

        const resultLabel = entry.result === "win"
          ? '<span class="col-result result-win">Gewonnen</span>'
          : entry.result === "lose"
            ? '<span class="col-result result-lose">Verloren</span>'
            : '<span class="col-result">Unbekannt</span>';

        const durationClassName = durationClasses.join(" ");
        const rowHtml =
          '<div class="last-game-row">' +
            '<span class="col-player">' + escapeHtml(entry.player || "") + '</span>' +
            '<span class="col-group">' + escapeHtml(groupName) + '</span>' +
            '<span class="' + durationClassName + '">' + durationValue + '</span>' +
            resultLabel +
            '<span class="col-date">' + (formatTimestamp(entry.finishedAt) || "") + '</span>' +
          "</div>";
        rows.push(rowHtml);
      }

      listEl.innerHTML = rows.join("");
      setStatus("");
    }

    function handleError(error) {
      console.error("Fehler beim Laden der Daten:", error);
      setStatus("Die Daten konnten nicht geladen werden. Bitte später erneut versuchen.", true);
      listEl.innerHTML = '<div class="empty-state">Keine Daten verfügbar.</div>';
    }

    onValue(ref(db, "publicOverview/lastGames"), (snapshot) => {
      const raw = snapshot.val();
      const parsed = parsePublicEntries(raw);
      const sanitized = sanitizeEntries(parsed);
      if (!sanitized.length) {
        listEl.innerHTML = '<div class="empty-state">Noch keine freigegebenen Spiele.</div>';
        setStatus("");
        return;
      }
      renderLastGames(sanitized);
      setStatus("");
    }, handleError);
  </script>
</body>
</html>
