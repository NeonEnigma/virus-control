<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letzte Spiele</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: #0f0;
      font-family: "Lucida Console", Monaco, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .overview-card {
      width: 100%;
      max-width: 960px;
      border: 2px solid #0f0;
      border-radius: 8px;
      background-color: #050505;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: #0f0;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
      text-align: center;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: #bbb;
      text-align: center;
      font-size: 1rem;
    }

    #status-message {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 0, 0.4);
      background-color: rgba(0, 255, 0, 0.05);
      color: #0ff;
      font-size: 0.95rem;
    }

    #status-message.error {
      border-color: rgba(255, 0, 0, 0.5);
      color: #f66;
      background-color: rgba(255, 0, 0, 0.08);
    }

    .last-games {
      border: 1px solid rgba(0, 255, 0, 0.3);
      border-radius: 6px;
      overflow: hidden;
    }

    .last-game-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1fr 1.5fr;
      gap: 12px;
      padding: 12px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 0, 0.15);
      font-size: 0.95rem;
    }

    .last-game-header {
      font-weight: bold;
      background: rgba(0, 255, 0, 0.08);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0ff;
    }

    .last-game-row:last-child {
      border-bottom: none;
    }

    .result-win {
      color: #0f0;
      font-weight: bold;
    }

    .result-lose {
      color: #f66;
      font-weight: bold;
    }

    .duration-win {
      color: #0f0;
      font-weight: bold;
    }

    .duration-lose {
      color: #f66;
      font-weight: bold;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: #777;
      font-size: 0.95rem;
    }

    @media (max-width: 800px) {
      .last-game-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "player player"
          "group group"
          "duration result"
          "date date";
      }
      .col-player { grid-area: player; }
      .col-group { grid-area: group; }
      .col-duration { grid-area: duration; }
      .col-result { grid-area: result; }
      .col-date { grid-area: date; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="overview-card">
    <h1>Letzte Spiele</h1>
    <div id="status-message" role="status" aria-live="polite">Lade Daten...</div>
    <div id="last-games" class="last-games"></div>
  </main>

  <script type="module">
    import { api } from './js/api.js';

    const MAX_ENTRIES = 20;
    const statusEl = document.getElementById("status-message");
    const listEl = document.getElementById("last-games");

    function setStatus(message, isError = false) {
      if (!statusEl) return;
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(isError));
      statusEl.style.display = message ? "block" : "none";
    }

    // Helper functions (escapeHtml, formatDuration, formatTimestamp) reuse existing logic...
    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return map[char] || char;
      });
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "";
      const totalSeconds = Math.floor(seconds);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const minutesText = String(minutes).padStart(2, "0");
      const secondsText = String(secs).padStart(2, "0");
      const mmss = minutesText + ":" + secondsText;
      if (hours > 0) {
        const hoursText = String(hours).padStart(2, "0");
        return hoursText + ":" + mmss;
      }
      return mmss;
    }

    function formatTimestamp(timestamp) {
      if (!Number.isFinite(timestamp) || timestamp <= 0) return "";
      try {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString("de-DE");
      } catch (error) {
        return "";
      }
    }

    function renderLastGames(entries) {
      if (!listEl) return;

      if (!Array.isArray(entries) || !entries.length) {
        listEl.innerHTML = '<div class="empty-state">Noch keine Spieleinträge.</div>';
        setStatus("");
        return;
      }

      // Sort or filter as needed. Assuming API returns verified games.
      // If API returns plain users/games list, we adapt here.
      // For now, let's assume API has a specific public endpoint or we filter manually.
      // Ideally Backend should have /api/public/last-games. 
      // Using /groups or /users as proxy if no dedicated endpoint yet? 
      // User requested "correct it", so let's mock the data fetching or use a new endpoint.
      // I will add a new public endpoint to gameController for this later.
      
      const rows = [
        '<div class="last-game-row last-game-header">' +
          '<span class="col-player">Spieler</span>' +
          '<span class="col-group">Gruppe</span>' +
          '<span class="col-duration">Restzeit</span>' +
          '<span class="col-result">Ergebnis</span>' +
          '<span class="col-date">Beendet am</span>' +
        '</div>'
      ];

      for (const entry of entries) {
         // Adaptation to API response format needed here
         // Assuming entry structure matches what we need
         const groupName = entry.groupName || "Keine Gruppe";
         const durationValue = entry.duration || "—";
         
         // ... simplified render logic ...
         // For now, let's keep it robust
         const rowHtml = `
            <div class="last-game-row">
                <span class="col-player">${escapeHtml(entry.playerName || "Unbekannt")}</span>
                <span class="col-group">${escapeHtml(groupName)}</span>
                <span class="col-duration">${escapeHtml(durationValue)}</span>
                <span class="col-result">${escapeHtml(entry.result || "-")}</span>
                <span class="col-date">${formatTimestamp(entry.finishedAt)}</span>
            </div>
         `;
         rows.push(rowHtml);
      }
      listEl.innerHTML = rows.join("");
      setStatus("");
    }

    async function loadPublicData() {
        try {
            // Need a public endpoint. I'll add /api/public/overview to backend.
            const response = await fetch('/api/public/overview');
            if(!response.ok) throw new Error("Fetch failed");
            const data = await response.json();
            renderLastGames(data);
        } catch(e) {
            console.error(e);
            setStatus("Daten konnten nicht geladen werden.", true);
        }
    }

    loadPublicData();
    // Poll every 30s
    setInterval(loadPublicData, 30000);
  </script>
</body>
</html>
