<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Datenbank – Netzwerkoptimierung</title>
  <style>/* CSS unverändert */ html,body{margin:0;padding:0;width:100%;height:100%;background-color:#000;font-family:monospace;color:#fdfdfd}.container{display:flex;flex-direction:column;height:100%;width:100%}.header{padding:20px;position:relative;border-bottom:1px solid #333}.back-arrow{text-decoration:none;position:absolute;top:20px;left:20px;font-size:15px;color:#0f0;cursor:pointer;padding:10px;z-index:100;background-color:rgba(0,0,0,.5);border-radius:5px}.back-arrow:hover{background-color:rgba(0,255,0,.2)}.heading{text-align:center;margin-bottom:20px;margin-top:20px}.heading h1{font-size:2.2rem;margin:0}.dashboard{display:flex;flex:1;height:calc(100% - 80px)}.column{padding:40px;overflow-y:auto}.left-column{flex:1;border-right:1px solid #333;display:flex;flex-direction:column;justify-content:flex-start}.right-column{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding-top:20px}#solutionButton{width:400px}.description{line-height:1.6}.description li,.description p{margin-bottom:20px;font-size:1.1rem}.description ul{margin-bottom:20px;padding-left:20px}.input-group{width:100%;max-width:90%;transform:translateY(10px);display:flex;flex-direction:column;align-items:center}.input-wrapper{width:66%;margin:0 auto}.input-group ol{padding-left:20px;margin-top:0;width:100%}.input-group li{margin-bottom:16px;font-size:1.1rem;display:flex;flex-direction:column;width:100%;align-items:flex-start}.input-label{margin-bottom:6px;width:100%;text-align:left}.input-fields{display:flex;align-items:center;justify-content:flex-start;margin-left:0}.input-group input{background-color:#222;color:#fdfdfd;border:1px solid #0f0;border-radius:5px;padding:6px;font-family:monospace;width:40px;height:30px;text-align:center;margin-right:8px;font-size:1rem}.input-group button{background-color:#0f0;color:#000;border:none;border-radius:7px;padding:15px;font-size:1.2rem;cursor:pointer;transition:background-color .2s;margin-top:20px;width:66%;margin-left:auto;margin-right:auto}.input-group button:hover{background-color:#6f6}.error{color:red;font-size:1.1rem;min-height:1.2em;margin-top:15px}.btn{background-color:#0f0;color:#000;border:none;border-radius:7px;padding:15px 30px;font-size:1.2rem;cursor:pointer;transition:background-color .2s;margin-top:20px}.btn:hover{background-color:#6f6}.success-container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background-color:#000;text-align:center}.success-icon{font-size:5rem;color:#0f0;margin-bottom:20px;animation:pulse 2s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}.success-title{color:#0f0;font-size:2.5rem;margin-bottom:15px}.success-message{color:#afa;font-size:1.5rem;margin-bottom:30px}.dashboard-btn{background-color:#0f0;color:#000;border:none;padding:12px 25px;border-radius:5px;font-size:1.2rem;cursor:pointer;text-decoration:none;transition:all .3s ease}.dashboard-btn:hover{background-color:#6f6;transform:scale(1.05);box-shadow:0 0 15px rgba(0,255,0,.5)}@media (max-width:900px){.dashboard{flex-direction:column}.column{padding:20px}.left-column{border-right:none;border-bottom:1px solid #333}}</style>
</head>
<body>
  
  <script type="module">
    import { api } from './js/api.js';

    function showSuccessPage() { /* ... unverändert ... */ document.body.innerHTML=`<div class="success-container"><div class="success-icon">✓</div><h1 class="success-title">Datenbank vollständig</h1><p class="success-message">Firewall aktiviert • Ports gesichert • System geschützt</p><p>Alle Daten wurden erfolgreich übertragen.</p><a href="dashboard.html" class="dashboard-btn">Zurück zum Dashboard</a></div>`}
    function showPuzzlePage() { /* ... unverändert ... */ document.body.innerHTML=`<div class="container"><div class="header"><a href="dashboard.html" class="back-arrow">&#8592; Dashboard</a><div class="heading"><h1>Datentransfer-Optimierung</h1></div></div><div class="dashboard" id="dashboardContent"><div class="column left-column"><div class="description"><p>Mein verrückter Professor hat, damit wir das Arbeiten mit Datenbanken lernen, ein sehr seltsames Programm programmiert, in dem fünf verschiedene Dateitypen (API-Anfrage, Binärdatei, CSV-Tabelle, DAT-Archiv, Excel-Datei) über einen schmalbandigen Notfallkanal übertragen werden mussten. Die Aufgabe war es, alle Dateien möglichst schnell zu übertragen. Dabei gab es aber eine Besonderheit: Datenpakete mussten immer aus entweder einer oder zwei Dateien bestehen und einen bestimmten Token enthalten. Dieser kann weder kopiert noch alleine gesendet werden, sondern nur als „Anhang“ an eine Datei. Er hat es damals immer mit einer Brücke veranschaulicht, die man nur mit einem Schlüssel überqueren kann. Fünf Menschen wollen rüber, aber die Brücke hält nur das Gewicht von maximal zwei Menschen gleichzeitig aus. Wenn zwei auf die andere Seite gegangen sind, muss immer einer, der bereits auf der anderen Seite steht oder gerade angekommen ist, den Schlüssel zurückbringen. Zwei Menschen bzw. bei uns zwei Datenpakete brauchen als Paket immer so lange wie der langsamere Mensch bzw. die größere (und dadurch langsamere) Datei.</p><p>Die Datenübertragung folgt diesen Regeln:</p><ul><li>Es können nur zwei Dateien gleichzeitig übertragen werden</li><li>Das Authentifizierungstoken muss nach jedem Transfer zurückgeschickt werden</li><li>Die Übertragungszeit entspricht der langsamsten Datei im Paket</li><li>Alle fünf Dateien müssen in möglichst kurzer Zeit vollständig übertragen werden</li></ul><p>Die Übertragungszeiten betragen:</p><ul><li>API-Anfrage (A): 1 Minute</li><li>Binärdatei (B): 3 Minuten</li><li>CSV-Tabelle (C): 6 Minuten</li><li>DAT-Archiv (D): 8 Minuten</li><li>Excel-Datei (E): 12 Minuten</li></ul><p>Fülle die Lücken mit den <strong>Anfangsbuchstaben</strong> (A, B, C, D, E) in der optimalen Reihenfolge ein, um die Daten in minimal möglicher Zeit zu übertragen.</p><p>Bei Schritten mit zwei Feldern werden jeweils zwei Dateien gleichzeitig übertragen. Bei Schritten mit einem Feld wird nur das Authentifizierungstoken zurückgeschickt.</p></div></div><div class="column right-column"><div class="input-group"><div class="input-wrapper"><ol><li><div class="input-label">Transfer 1 (zwei Dateien gleichzeitig senden):</div><div class="input-fields"><input type="text" id="step1a" maxlength="1" placeholder="A"><input type="text" id="step1b" maxlength="1" placeholder="A"></div></li><li><div class="input-label">Rückübertragung Token:</div><div class="input-fields"><input type="text" id="step2" maxlength="1" placeholder="A"></div></li><li><div class="input-label">Transfer 2 (zwei Dateien gleichzeitig senden):</div><div class="input-fields"><input type="text" id="step3a" maxlength="1" placeholder="A"><input type="text" id="step3b" maxlength="1" placeholder="A"></div></li><li><div class="input-label">Rückübertragung Token:</div><div class="input-fields"><input type="text" id="step4" maxlength="1" placeholder="A"></div></li><li><div class="input-label">Transfer 3 (zwei Dateien gleichzeitig senden):</div><div class="input-fields"><input type="text" id="step5a" maxlength="1" placeholder="A"><input type="text" id="step5b" maxlength="1" placeholder="A"></div></li><li><div class="input-label">Rückübertragung Token:</div><div class="input-fields"><input type="text" id="step6" maxlength="1" placeholder="A"></div></li><li><div class="input-label">Transfer 4 (zwei Dateien gleichzeitig senden):</div><div class="input-fields"><input type="text" id="step7a" maxlength="1" placeholder="A"><input type="text" id="step7b" maxlength="1" placeholder="A"></div></li></ol><div style="text-align: center; width: 100%;"><button id="solutionButton">Lösung prüfen</button></div></div><p class="error" id="errorDisplay"></p></div></div></div></div>`}

    (async function init() {
      try {
        const user = await api.request('/users/me');
        const puzzles = user.puzzles || {};

        if (user.isAdmin === true || puzzles.terminalCompleted === true) {
             if (puzzles.datenbankCompleted === true) {
                 showSuccessPage();
             } else {
                 showPuzzlePage();
                 initializePuzzle(user);
             }
        } else {
             alert("Zugriff verweigert! Du musst zuerst das Terminal-Rätsel lösen.");
             window.location.href = 'terminal.html';
        }
      } catch (e) {
          console.error(e);
          window.location.href = 'index.html';
      }
    })();

    function initializePuzzle(user) { /* ... Ihre Rätsel-Logik, unverändert ... */ const e=[["A+B","A","D+E","B","A+C","A","A+B"],["A+B","A","A+C","A","D+E","B","A+B"],["A+C","A","A+B","A","D+E","B","A+B"],["A+B","B","D+E","A","A+C","A","A+B"],["A+B","A","D+E","B","A+B","A","A+C"],["A+B","B","D+E","A","A+B","A","A+C"]];function t(t){return t.replace(/\s+/g,"").toUpperCase()}function n(e,n){const o=[t(e),t(n)];return o.sort(),o.join("+")}function o(){const a=n(document.getElementById("step1a").value,document.getElementById("step1b").value),i=t(document.getElementById("step2").value),d=n(document.getElementById("step3a").value,document.getElementById("step3b").value),l=t(document.getElementById("step4").value),r=n(document.getElementById("step5a").value,document.getElementById("step5b").value),c=t(document.getElementById("step6").value),s=n(document.getElementById("step7a").value,document.getElementById("step7b").value),u=[a,i,d,l,r,c,s];e.some(t=>t.every((e,t)=>e===u[t]))?api.request('/game/puzzles', 'PUT', {datenbankCompleted:!0}).then(()=>{console.log("Datenbank-Rätsel-Status gespeichert!"),window.location.href="success.html"}).catch(e=>document.getElementById("errorDisplay").textContent="Fehler beim Speichern!"):document.getElementById("errorDisplay").textContent="Falsche Lösung! Der Datentransfer ist fehlgeschlagen. Bitte überprüfe deine Eingaben."}document.getElementById("solutionButton").addEventListener("click",o)}
  </script>
</body>
</html>
