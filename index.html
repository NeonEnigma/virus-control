<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { background-color: #000000; color: #0f0; font-family: monospace; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    #login-container { border: 2px solid #0f0; padding: 20px; width: 300px; box-sizing: border-box; }
    h2 { margin-top: 0; margin-bottom: 20px; font-weight: normal; }
    label { display: block; margin-bottom: 8px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 6px; margin-bottom: 15px; box-sizing: border-box; border: 2px solid #0f0; background: #000; color: #0f0; font-family: monospace; }
    input[type="button"] { background-color: #000; color: #0f0; border: 2px solid #0f0; padding: 6px 12px; cursor: pointer; font-family: monospace; }
    input[type="button"]:hover { background-color: #0f0; color: #000; }
    .error { color: #f00; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="login-container">
    <h2>Anmeldung</h2>
    <div id="error-message" class="error" style="display: none;"></div>
    <label for="username">Benutzername (E-Mail):</label>
    <input type="text" id="username" placeholder=""/>
    <label for="password">Passwort:</label>
    <input type="password" id="password" placeholder="" />
    <input type="button" id="loginButton" value="Anmelden" />
  </div>

  <script type="module">
    import { api } from './js/api.js';

    const loginButton = document.getElementById("loginButton");
    const errorDiv = document.getElementById("error-message");
    
    loginButton.addEventListener("click", () => {
      const email = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      errorDiv.style.display = "none";

      api.login(email, password)
        .then((user) => {
           if (user.role === 'super-admin' || user.role === 'restricted-admin' || user.isAdmin) {
             window.location.href = "admin.html";
           } else {
             window.location.href = "terminal.html";
           }
        })
        .catch((error) => {
          errorDiv.style.display = "block";
          errorDiv.textContent = error.message || "Falsche E-Mail oder Passwort!";
        });
    });
  </script>
</body>
</html>
