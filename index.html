<html lang="de">

  <title>Login</title>
  <style>
    body { background-color: #000000; color: #0f0; font-family: monospace; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }

    h2 { margin-top: 0; margin-bottom: 20px; font-weight: normal; }
    label { display: block; margin-bottom: 8px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 6px; margin-bottom: 15px; box-sizing: border-box; border: 2px solid #0f0; background: #000; color: #0f0; font-family: monospace; }

    input[type="button"]:hover { background-color: #0f0; color: #000; }
    .error { color: #f00; margin-bottom: 10px; }
  </style>
</head>

    <input type="button" id="loginButton" value="Anmelden" />
