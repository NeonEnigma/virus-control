<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    /* Ihr gesamtes CSS bleibt unverändert hier oben */
    body { background-color: #000000; color: #0f0; font-family: monospace; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .invisible { display: none !important; }
    .admin-reset-btn { position: absolute; top: 10px; left: 10px; background-color: #000; color: #0f0; border: 2px solid #0f0; padding: 4px 8px; cursor: pointer; font-family: monospace; }
    .admin-reset-btn:hover { background-color: #0f0; color: #000; }
    .timer-area { position: absolute; top: 10px; right: 10px; font-family: monospace; color: #0f0; text-align: right; }
    .timer-area button { background: #000; border: 2px solid #0f0; color: #0f0; padding: 4px 8px; font-family: monospace; cursor: pointer; }
    .timer-area button:hover { background: #0f0; color: #000; }
    #login-container { border: 2px solid #0f0; padding: 20px; width: 300px; box-sizing: border-box; }
    h2 { margin-top: 0; margin-bottom: 20px; font-weight: normal; }
    label { display: block; margin-bottom: 8px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 6px; margin-bottom: 15px; box-sizing: border-box; border: 2px solid #0f0; background: #000; color: #0f0; font-family: monospace; }
    input[type="button"] { background-color: #000; color: #0f0; border: 2px solid #0f0; padding: 6px 12px; cursor: pointer; font-family: monospace; }
    input[type="button"]:hover { background-color: #0f0; color: #000; }
    .error { color: #f00; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="login-container">
    <h2>Anmeldung</h2>
    <div id="error-message" class="error" style="display: none;"></div>
    <label for="username">Benutzername (E-Mail):</label>
    <input type="text" id="username" placeholder=""/>
    <label for="password">Passwort:</label>
    <input type="password" id="password" placeholder="" />
    <input type="button" id="loginButton" value="Anmelden" />
  </div>

  <script type="module">
    // 1. Firebase initialisieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    // NEU: 'get' wird importiert, 'onValue' wird nicht mehr benötigt
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // Ihre Web-App-Konfiguration von Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    // Firebase App initialisieren und Dienste abrufen
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // 2. Anwendungslogik
    const loginButton = document.getElementById("loginButton");
    const errorDiv = document.getElementById("error-message");
    
    loginButton.addEventListener("click", () => {
      const email = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      errorDiv.style.display = "none";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          const userRef = ref(db, 'users/' + user.uid);

          // ==========================================================
          // VERBESSERTE LOGIK mit get() statt onValue()
          // get() ist für einmaliges Lesen gedacht und hat eine klarere Fehlerbehandlung.
          // ==========================================================
          get(userRef).then((snapshot) => {
            if (snapshot.exists()) {
              // Daten für den Benutzer wurden gefunden
              const userData = snapshot.val();
              if (userData && userData.isAdmin === true) {
                window.location.href = "admin.html";
              } else {
                window.location.href = "terminal.html";
              }
            } else {
              // Dieser Fall ist wichtig: Der Benutzer existiert in 'Authentication',
              // aber es gibt keinen Datensatz für ihn in der 'Realtime Database'.
              console.log("Kein Datenbankeintrag für diesen Benutzer gefunden. Behandle als normalen Benutzer.");
              window.location.href = "terminal.html";
            }
          }).catch((error) => {
            // HIER werden jetzt Fehler wie "Permission Denied" von den Security Rules abgefangen!
            console.error("Fehler beim Lesen der Benutzerdaten aus der Datenbank:", error);
            alert("Ein Fehler ist aufgetreten. Sie konnten nicht weitergeleitet werden.");
          });
        })
        .catch((error) => {
          // Fehler beim Login selbst (falsches Passwort etc.)
          errorDiv.style.display = "block";
          errorDiv.textContent = "Falsche E-Mail oder Passwort!";
          console.error("Login-Fehler:", error);
        });
    });
  </script>
</body>
</html>
