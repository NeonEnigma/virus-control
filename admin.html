<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <style>
    body { 
      background-color: #000000; 
      color: #0f0; 
      font-family: monospace; 
      padding: 20px;
    }
    h1, h2 {
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }
    #admin-dashboard { 
      display: none; /* Wird per Skript eingeblendet */
    }
    .user-card {
      border: 2px solid #0f0;
      padding: 15px;
      margin-bottom: 20px;
      background-color: #050505;
    }
    .user-card h3 {
      margin-top: 0;
      color: #fff;
    }
    .user-card p {
      margin: 5px 0;
    }
    .user-card button {
      background: #000;
      border: 2px solid #0f0;
      color: #0f0;
      padding: 6px 12px;
      font-family: monospace;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 10px;
    }
    .user-card button:hover {
      background: #0f0;
      color: #000;
    }
    .timer-active {
        color: #ff0; /* Gelb für laufende Timer */
        font-weight: bold;
    }
    .timer-inactive {
        color: #888; /* Grau für inaktive Timer */
    }
    .solved-info {
        color: #0ff; /* Cyan für gelöste Rätsel */
    }
  </style>
</head>
<body>

  <h1>Admin Dashboard</h1>
  <div id="loading-message">Prüfe Berechtigung...</div>

  <div id="admin-dashboard">
    <h2>Benutzerübersicht</h2>
    <div id="user-list">
      </div>
  </div>


  <script type="module">
    // Firebase initialisieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // "Türsteher"-Skript zur Berechtigungsprüfung
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userRef = ref(db, 'users/' + user.uid);
        onValue(userRef, (snapshot) => {
          const userData = snapshot.val();
          if (userData && userData.isAdmin === true) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            initializeDashboard();
          } else {
            window.location.href = 'index.html';
          }
        }, { onlyOnce: true });
      } else {
        window.location.href = 'index.html';
      }
    });

    // === FINALE FUNKTION: Baut das Dashboard und hält es aktuell ===
    function initializeDashboard() {
      const usersRef = ref(db, 'users');
      const userListDiv = document.getElementById('user-list');

      // Lausche auf ALLE Änderungen im 'users'-Ast der Datenbank für Echtzeit-Updates
      onValue(usersRef, (snapshot) => {
        const users = snapshot.val();
        userListDiv.innerHTML = ''; // Leere die Liste vor jedem Neuaufbau

        // Gehe jeden Benutzer in der Datenbank durch
        for (const uid in users) {
          const user = users[uid];
          
          // Wir wollen den Admin nicht in der Liste anzeigen
          if (user.isAdmin) continue;

          // Timer-Status berechnen und HTML dafür vorbereiten
          let timerStatusHTML = '<p class="timer-inactive">Timer inaktiv</p>';
          if (user.timer && user.timer.endTime) {
            const diffMs = user.timer.endTime - Date.now();
            if (diffMs > 0) {
              const diffSec = Math.floor(diffMs / 1000);
              const hh = Math.floor(diffSec / 3600);
              const mm = Math.floor((diffSec % 3600) / 60);
              const ss = diffSec % 60;
              timerStatusHTML = `<p class="timer-active">Läuft: ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}</p>`;
            } else {
              timerStatusHTML = '<p class="timer-inactive">Timer abgelaufen</p>';
            }
          }
          
          // Statistik-Status vorbereiten
          let solvedStatusHTML = '';
          if (user.solvedStats && user.solvedStats.remainingTimeOnSolve) {
            solvedStatusHTML = `<p class="solved-info">Gelöst mit ${Math.floor(user.solvedStats.remainingTimeOnSolve / 60)} min Restzeit.</p>`;
          }

          // HTML-Karte für den Benutzer erstellen
          const userCard = document.createElement('div');
          userCard.className = 'user-card';
          userCard.innerHTML = `
            <h3>${user.email}</h3>
            ${timerStatusHTML}
            ${solvedStatusHTML}
            <div>
              <button class="start-btn" data-uid="${uid}">Start / Neustart (2h)</button>
              <button class="add-time-btn" data-uid="${uid}">+10 Min</button>
              <button class="stop-btn" data-uid="${uid}">Stopp</button>
            </div>
          `;
          
          userListDiv.appendChild(userCard);
        }
      });
    }

    // === FINALE LOGIK: Event-Handling für alle Buttons ===
    document.getElementById('user-list').addEventListener('click', (e) => {
      // Prüfen, ob ein Button geklickt wurde
      if (e.target.tagName !== 'BUTTON') return;

      const uid = e.target.dataset.uid;
      if (!uid) return;
      
      const targetUserTimerRef = ref(db, `users/${uid}/timer`);

      // Entscheiden, welche Aktion ausgeführt wird
      if (e.target.classList.contains('start-btn')) {
        const newEndTime = Date.now() + 7200 * 1000; // 2 Stunden von jetzt an
        set(targetUserTimerRef, { endTime: newEndTime, initialDuration: 7200 });
      }

      if (e.target.classList.contains('add-time-btn')) {
        // Lese zuerst den aktuellen Wert, um Zeit sicher hinzuzufügen
        get(targetUserTimerRef).then((snapshot) => {
          const timerData = snapshot.val();
          // Zeit nur hinzufügen, wenn der Timer bereits läuft
          if (timerData && timerData.endTime && timerData.endTime > Date.now()) {
            const newEndTime = timerData.endTime + 10 * 60 * 1000; // +10 Minuten
            set(targetUserTimerRef, { ...timerData, endTime: newEndTime });
          } else {
            alert("Timer ist nicht aktiv. Bitte zuerst starten.");
          }
        });
      }

      if (e.target.classList.contains('stop-btn')) {
        set(targetUserTimerRef, null); // Löscht den Timer-Eintrag für diesen User
      }
    });
  </script>
</body>
</html>
