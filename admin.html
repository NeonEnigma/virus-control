<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { background-color: #000; color: #0f0; font-family: monospace; padding: 20px; word-wrap: break-word; }
    h1, h2, h3 { color: #0f0; text-shadow: 0 0 5px #0f0; margin-top: 0; }
    #admin-dashboard { display: none; }
    .admin-section { border: 1px solid #0f0; background-color: #050505; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
    .form-grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .form-card { flex: 1 1 280px; min-width: 260px; border: 1px solid #0f0; padding: 15px; border-radius: 6px; background-color: #080808; }
    label { display: block; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], select {
      width: 100%; padding: 6px; background-color: #111; color: #0f0; border: 1px solid #0f0; border-radius: 4px; font-family: monospace; margin-bottom: 10px; box-sizing: border-box;
    }
    button { background: #000; border: 2px solid #0f0; color: #0f0; padding: 6px 12px; font-family: monospace; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0f0; color: #000; }
    .form-feedback { min-height: 18px; color: #0ff; font-size: 0.9rem; }
    .user-card { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background-color: #050505; border-radius: 6px; }
    .user-card h3 { margin: 0 0 10px; color: #fff; }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; border: 1px solid currentColor; font-size: 0.75rem; vertical-align: middle; margin-left: 8px; }
    .role-user { color: #0ff; } .role-restricted-admin { color: #ff0; } .role-super-admin { color: #f0f; }
    .meta-line { margin: 4px 0; } .meta-label { color: #bbb; }
    .inline-label { display: block; margin: 10px 0; }
    .controls-grid { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-top: 15px; }
    .timer-start-group { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
    .timer-adjust-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .timer-input { width: 90px; }
    .timer-active { color: #ff0; font-weight: bold; }
    .timer-inactive { color: #888; }
    .timer-paused { color: #0ff; }
    .timer-paused-win { color: #0f0; font-weight: bold; }
    .timer-paused-lose { color: #f66; font-weight: bold; }
    .solved-info { color: #0ff; }
    .restricted-note { color: #ccc; font-size: 0.9rem; margin-top: 10px; }
    .info-text { margin: 0; color: #bbb; }
    #completed-groups-section { display: none; }
    #last-games-section { display: none; }
    .group-row { display: flex; justify-content: space-between; border-bottom: 1px solid #0f0; padding: 6px 0; font-size: 0.95rem; }
    .group-row span { flex: 1; }
    .group-name { font-weight: bold; color: #fff; }
    .group-duration { text-align: center; color: #0ff; }
    .group-finished-at { text-align: right; color: #bbb; }
    .last-game-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(0, 255, 0, 0.2); font-size: 0.95rem; }
    .last-game-header { font-weight: bold; border-bottom: 2px solid rgba(0, 255, 0, 0.5); }
    .last-game-row span { flex: 1; }
    .last-game-user { flex: 2; color: #fff; }
    .last-game-group { flex: 1.5; color: #bbb; }
    .last-game-duration { flex: 1; color: #0ff; }
    .last-game-duration-win { color: #0f0; font-weight: bold; }
    .last-game-duration-lose { color: #f66; font-weight: bold; }
    .last-game-result { flex: 1; }
    .last-game-date { flex: 1.5; text-align: right; color: #bbb; }
    .last-game-result-win { color: #0f0; }
    .last-game-result-lose { color: #f66; }
    @media (max-width: 768px) {
      body { padding: 12px; font-size: 16px; }
      .form-grid { flex-direction: column; }
      .timer-start-group, .timer-adjust-group { flex-direction: column; align-items: stretch; }
      button { width: 100%; box-sizing: border-box; }
      .timer-input { width: 100%; }
      .group-row { flex-direction: column; align-items: flex-start; gap: 4px; }
      .group-duration, .group-finished-at { text-align: left; }
      .last-game-row { flex-direction: column; align-items: flex-start; }
      .last-game-date { text-align: left; }
    }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <div id="loading-message">Prüfe Berechtigung...</div>

  <div id="admin-dashboard">
    <section id="super-admin-section" class="admin-section">
      <h2>Benutzer- und Gruppenverwaltung</h2>
      <div class="form-grid">
        <form id="create-group-form" class="form-card">
          <h3>Neue Gruppe</h3>
          <label for="new-group-name">Gruppenname</label>
          <input type="text" id="new-group-name" placeholder="z. B. Team Alpha" required />
          <button type="submit">Gruppe anlegen</button>
          <p class="form-feedback" id="group-feedback"></p>
        </form>

        <form id="create-user-form" class="form-card">
          <h3>Normalen Nutzer anlegen</h3>
          <label for="new-user-email">E-Mail</label>
          <input type="email" id="new-user-email" placeholder="nutzer@example.com" required />
          <label for="new-user-password">Passwort</label>
          <input type="password" id="new-user-password" placeholder="Passwort" required />
          <label for="new-user-group">Gruppe</label>
          <select id="new-user-group">
            <option value="">Keine Gruppe</option>
          </select>
          <label style="display:inline-flex; align-items:center; margin-top:10px;">
            <input type="checkbox" id="new-user-super-admin" style="width:auto; margin-right:8px;">
            Als Super-Admin anlegen?
          </label>
          <button type="submit">Nutzer erstellen</button>
          <p class="form-feedback" id="create-user-feedback"></p>
        </form>

        <form id="create-restricted-admin-form" class="form-card">
          <h3>Eingeschränkten Admin anlegen</h3>
          <label for="restricted-admin-email">E-Mail</label>
          <input type="email" id="restricted-admin-email" placeholder="admin@example.com" required />
          <label for="restricted-admin-password">Passwort</label>
          <input type="password" id="restricted-admin-password" placeholder="Passwort" required />
          <label for="restricted-admin-group">Gruppe</label>
          <select id="restricted-admin-group" required>
            <option value="">Bitte Gruppe wählen</option>
          </select>
          <label for="restricted-admin-assigned">Zugeordneter Nutzer</label>
          <select id="restricted-admin-assigned">
            <option value="">Kein Nutzer</option>
          </select>
          <button type="submit">Eingeschränkten Admin erstellen</button>
          <p class="form-feedback" id="restricted-admin-feedback"></p>
        </form>
      </div>
    </section>

    <section id="restricted-admin-hint" class="admin-section" style="display: none;"></section>

    <h2>Benutzerübersicht</h2>
    <div id="user-list"></div>

    <section id="completed-groups-section" class="admin-section">
      <h2>Fertige Gruppen</h2>
      <div id="completed-groups"></div>
    </section>

    <section id="last-games-section" class="admin-section">
      <h2>Letzte Spiele</h2>
      <div id="last-games"></div>
    </section>
  </div>

  <script type="module">
    import { api } from './js/api.js';

    const state = { currentUser: null, users: [], groups: [] }; // Changed from {} to [] for users/groups for simpler mapping, or keep {} if index by ID is needed. 
    // Adapting to array returns from API:
    // API returns arrays for users and groups. We can index them if needed.

    let masterTimerInterval = null;
    let pollingInterval = null;
    let formsInitialized = false;

    async function initAdmin() {
       try {
         const me = await api.request('/users/me');
         if (me.role !== 'super-admin' && me.role !== 'restricted-admin') {
            window.location.href = "terminal.html";
            return;
         }
         state.currentUser = me;
         document.getElementById("loading-message").style.display = "none";
         document.getElementById("admin-dashboard").style.display = "block";

         setupForms();
         
         // Initial Load
         await loadData();

         // Poll data every 5 seconds
         pollingInterval = setInterval(loadData, 5000);
         
         // Timer update every second for UI
         if (masterTimerInterval) clearInterval(masterTimerInterval);
         masterTimerInterval = setInterval(updateAllTimersOnPage, 1000);

       } catch (e) {
         console.error(e);
         document.body.innerHTML = `<h2 style="color:red; text-align:center;">Admin Auth Error</h2><p style="text-align:center;">${e.message}</p><div style="text-align:center;"><button onclick="window.location.href='index.html'">Zurück zum Login</button></div>`;
         // window.location.href = "index.html"; // REMOVED
       }
    }

    async function loadData() {
       try {
         const [usersData, groupsData] = await Promise.all([
           api.getUsers(),
           api.request('/groups')
         ]);
         
         // Convert arrays to objects for compatibility with existing render functions if possible, 
         // OR update render functions. Given the complexity of existing code, let's map array to object by ID.
         state.users = usersData.reduce((acc, u) => { acc[u.id] = u; return acc; }, {});
         state.groups = groupsData.reduce((acc, g) => { acc[g.id] = g; return acc; }, {});

         renderUserList();
         // refreshCreationFormUserOptions(); // logic might need update if depend on secondary auth
         renderGroupOptions();
         renderCompletedGroups(); // might need adaptation
         // renderLastGames(); // might need adaptation
       } catch (e) {
         console.error("Error loading data", e);
       }
    }
    
    // Start
    initAdmin();

    function setupRealtimeListeners() {
      // Replaced by polling in initAdmin
    }

    function setupForms() {
      if (formsInitialized) return;
      formsInitialized = true;

      const userListDiv = document.getElementById("user-list");
      if (userListDiv) {
        userListDiv.addEventListener("click", handleUserListClick);
        userListDiv.addEventListener("change", handleUserListChange);
      }
      const createGroupForm = document.getElementById("create-group-form");
      if (createGroupForm) createGroupForm.addEventListener("submit", handleCreateGroup);

      const createUserForm = document.getElementById("create-user-form");
      if (createUserForm) createUserForm.addEventListener("submit", handleCreateUser);

      const createRestrictedForm = document.getElementById("create-restricted-admin-form");
      if (createRestrictedForm) createRestrictedForm.addEventListener("submit", handleCreateRestrictedAdmin);

      const restrictedGroupSelect = document.getElementById("restricted-admin-group");
      if (restrictedGroupSelect) {
        restrictedGroupSelect.addEventListener("change", () => {
          const assignedSelect = document.getElementById("restricted-admin-assigned");
          populateAssignedUserSelect(assignedSelect, restrictedGroupSelect.value);
        });
      }
    }

    async function handleCreateGroup(event) {
      event.preventDefault();
      const nameInput = document.getElementById("new-group-name");
      const feedback = document.getElementById("group-feedback");
      if (!nameInput) return;

      const groupName = nameInput.value.trim();
      if (!groupName) { setFeedback(feedback, "Bitte einen Gruppennamen eingeben."); return; }

      try {
        await api.createGroup(groupName);
        setFeedback(feedback, `Gruppe "${groupName}" erstellt.`); 
        nameInput.value = "";
        loadData(); // Refresh
      } catch (error) {
        console.error("Fehler beim Anlegen der Gruppe:", error); 
        setFeedback(feedback, "Fehler beim Anlegen der Gruppe.");
      }
    }

    async function handleCreateUser(event) {
      event.preventDefault();
      const emailInput = document.getElementById("new-user-email");
      const passwordInput = document.getElementById("new-user-password");
      const groupSelect = document.getElementById("new-user-group");
      const feedback = document.getElementById("create-user-feedback");
      if (!emailInput || !passwordInput) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) { setFeedback(feedback, "E-Mail und Passwort dürfen nicht leer sein."); return; }

      try {
        await api.request('/auth/register', 'POST', {
          email, 
          password, 
          role: document.getElementById("new-user-super-admin")?.checked ? 'super-admin' : 'user', 
          groupId: groupSelect?.value || null
        });
        setFeedback(feedback, "Nutzer erfolgreich erstellt.");
        emailInput.value = ""; passwordInput.value = ""; if (groupSelect) groupSelect.value = "";
        loadData();
      } catch (error) {
        console.error("Fehler beim Anlegen eines Nutzers:", error);
        setFeedback(feedback, error.message || "Fehler");
      }
    }

    async function handleCreateRestrictedAdmin(event) {
      event.preventDefault();
      const emailInput = document.getElementById("restricted-admin-email");
      const passwordInput = document.getElementById("restricted-admin-password");
      const groupSelect = document.getElementById("restricted-admin-group");
      const assignedSelect = document.getElementById("restricted-admin-assigned");
      const feedback = document.getElementById("restricted-admin-feedback");

      if (!emailInput || !passwordInput || !groupSelect) return;
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const groupId = groupSelect.value;
      const assignedUid = assignedSelect?.value || "";

      if (!email || !password) { setFeedback(feedback, "E-Mail und Passwort dürfen nicht leer sein."); return; }
      if (!groupId) { setFeedback(feedback, "Bitte eine Gruppe auswählen."); return; }

      if (assignedUid) {
        const assignedUser = state.users[assignedUid];
        if (!assignedUser || resolveRole(assignedUser) !== "user" || assignedUser.groupId !== groupId) {
          setFeedback(feedback, "Der ausgewählte Nutzer gehört nicht zu dieser Gruppe."); return;
        }
      }

      try {
        await api.request('/auth/register', 'POST', {
            email,
            password,
            role: 'restricted-admin',
            groupId,
            assignedUserUid: assignedUid || null
        });

        setFeedback(feedback, "Eingeschränkten Admin erstellt.");
        emailInput.value = ""; passwordInput.value = ""; groupSelect.value = "";
        if (assignedSelect) assignedSelect.innerHTML = '<option value="">Kein Nutzer</option>';
        loadData();
      } catch (error) {
        console.error("Fehler beim Anlegen eines eingeschränkten Admins:", error);
        setFeedback(feedback, error.message || "Fehler beim Anlegen");
      }
    }

    async function handleUserListClick(event) {
      if (event.target.tagName !== "BUTTON") return;
      const button = event.target;
      const uid = button.dataset.uid;
      
      if (button.classList.contains("delete-user-btn")) {
        if (confirm("Möchtest du diesen Nutzer wirklich unwiderruflich löschen?")) {
           try {
             await api.request(`/users/${uid}`, 'DELETE');
             alert("Nutzer gelöscht.");
             loadData();
           } catch (e) {
             console.error(e);
             alert("Löschen fehlgeschlagen: " + e.message);
           }
        }
        return;
      }
      
      if (!uid || !state.users[uid]) return;

      const isTimerAction =
        button.classList.contains("start-btn") ||
        button.classList.contains("add-time-btn") ||
        button.classList.contains("subtract-time-btn") ||
        button.classList.contains("pause-resume-btn");

      if (isTimerAction) {
        if (!canCurrentAdminControlUser(uid) && state.currentUser.role !== "super-admin") {
          alert("Du hast keine Berechtigung, diesen Nutzer zu steuern.");
          return;
        }
      }

      // const timerRef = ref(db, `users/${uid}/timer`); // REMOVED legacy firebase ref

      if (button.classList.contains("start-btn")) {
        const inputEl = document.getElementById(`timer-input-${uid}`);
        const minutes = parseInt(inputEl?.value ?? "0", 10);
        if (!Number.isFinite(minutes) || minutes <= 0) { alert("Bitte eine gültige, positive Minutenzahl eingeben."); return; }
        const durationInSeconds = minutes * 60;
        const newEndTime = new Date(Date.now() + durationInSeconds * 1000).toISOString();
        
        try {
          await api.request(`/users/${uid}`, 'PUT', {
            timerEndTime: newEndTime,
            timerInitialDuration: durationInSeconds,
            timerStatus: 'active',
            lastGame: null,
            solvedStats: null
          });
          loadData(); // Refresh UI
        } catch (error) {
          console.error("Timer konnte nicht gestartet werden:", error);
          alert("Timer konnte nicht gestartet werden.");
        }
        return;
      }

      if (button.classList.contains("add-time-btn")) {
        try {
          const user = state.users[uid];
          const timerData = user?.timer || {}; // Assuming updated structure from backend
          const now = Date.now();
          const pEndTime = timerData.endTime ? new Date(timerData.endTime).getTime() : 0;

          if (timerData.timerStatus === 'active' && pEndTime > now) {
             const newEndTime = new Date(pEndTime + 600000).toISOString();
             await api.request(`/users/${uid}`, 'PUT', { timerEndTime: newEndTime });
          } else if (timerData.timerStatus === 'paused' && Number.isFinite(timerData.pausedRemainingSeconds)) { // Note mapping might be needed
             const newRemaining = Math.max(0, Math.floor(timerData.pausedRemainingSeconds) + 600);
             await api.request(`/users/${uid}`, 'PUT', { timerPausedRemaining: newRemaining });
          } else {
            alert("Timer ist nicht aktiv. Bitte zuerst starten.");
            return;
          }
           loadData(); // Refresh API
        } catch (error) {
          console.error("Zeit konnte nicht hinzugefügt werden:", error);
          alert("Zeit konnte nicht hinzugefügt werden.");
        }
        return;
      }

      if (button.classList.contains("subtract-time-btn")) {
        try {
          const user = state.users[uid];
          const timerData = user?.timer || {};
          const now = Date.now();
          const pEndTime = timerData.endTime ? new Date(timerData.endTime).getTime() : 0;

          if (timerData.timerStatus === 'active' && pEndTime > now) {
             let newTime = pEndTime - 600000;
             if (now >= newTime) {
                // Expired
                await api.request(`/users/${uid}`, 'PUT', { timerEndTime: null, timerStatus: 'idle' });
             } else {
                await api.request(`/users/${uid}`, 'PUT', { timerEndTime: new Date(newTime).toISOString() });
             }
          } else if (timerData.timerStatus === 'paused' && Number.isFinite(timerData.pausedRemainingSeconds)) {
             const newRemaining = Math.max(0, Math.floor(timerData.pausedRemainingSeconds) - 600);
             if (newRemaining <= 0) {
                 await api.request(`/users/${uid}`, 'PUT', { timerPausedRemaining: 0, timerStatus: 'idle' });
             } else {
                 await api.request(`/users/${uid}`, 'PUT', { timerPausedRemaining: newRemaining });
             }
          } else {
             alert("Timer ist nicht aktiv. Zeit kann nicht abgezogen werden.");
             return;
          }
          loadData();
        } catch (error) {
          console.error("Zeit konnte nicht abgezogen werden:", error);
          alert("Zeit konnte nicht abgezogen werden.");
        }
        return;
      }

      if (button.classList.contains("pause-resume-btn")) {
        try {
          const now = Date.now();
          const user = state.users[uid];
          const timerData = user?.timer || {};
          
          // Logic: If paused (pausedRemainingSeconds exists), resume. If active, pause (save remaining).
          
          if (timerData.timerStatus === 'paused' && Number.isFinite(timerData.pausedRemainingSeconds)) {
             // RESUME
             const pausedSeconds = Math.max(1, Math.floor(timerData.pausedRemainingSeconds));
             const initialDuration = Number.isFinite(timerData.initialDuration) ? timerData.initialDuration : pausedSeconds;
             const newEndTime = new Date(now + (pausedSeconds * 1000)).toISOString();
             
             await api.request(`/users/${uid}`, 'PUT', { 
                 timerEndTime: newEndTime, 
                 timerStatus: 'active',
                 // initialDuration // usually keep original
             });
             
          } else if (timerData.timerStatus === 'active' && timerData.endTime && new Date(timerData.endTime).getTime() > now) {
             // PAUSE
             const pEndTime = new Date(timerData.endTime).getTime();
             const remainingSeconds = Math.max(0, Math.floor((pEndTime - now) / 1000));
             
             if (remainingSeconds <= 0) {
                 await api.request(`/users/${uid}`, 'PUT', { timerStatus: 'idle', timerEndTime: null });
             } else {
                 const nextStatus = (timerData.status === "win-paused") ? "win-paused" : "paused"; // or just 'paused'
                 await api.request(`/users/${uid}`, 'PUT', { 
                     timerStatus: 'paused',
                     timerPausedRemaining: remainingSeconds,
                     // pausedAt: now // not strictly needed if we just track remaining
                 });
             }
          } else {
              alert("Timer ist nicht aktiv.");
              return;
          }
          loadData();
        } catch (error) {
          console.error("Timer konnte nicht pausiert/fortgesetzt werden:", error);
          alert("Timer konnte nicht pausiert/fortgesetzt werden.");
        }
        return;
      }
    }

    function handleUserListChange(event) {
      const target = event.target; if (!target) return;

      if (target.matches(".group-select")) {
        const uid = target.dataset.uid; if (!uid || !state.users[uid]) return;
        const newGroupId = target.value || null;
        const updates = { groupId: newGroupId };
        const role = resolveRole(state.users[uid]);
        if (role === "restricted-admin") {
          const assignedUid = state.users[uid].assignedUserUid;
          if (!newGroupId || !assignedUid || !state.users[assignedUid] || state.users[assignedUid].groupId !== newGroupId) {
            updates.assignedUserUid = null;
          }
        }
        update(ref(db, `users/${uid}`), updates).catch((error) => {
          console.error("Fehler beim Aktualisieren der Gruppe:", error);
          alert("Gruppe konnte nicht aktualisiert werden.");
        });
      }

      if (target.matches(".assigned-user-select")) {
        const uid = target.dataset.uid; if (!uid || !state.users[uid]) return;
        const adminData = state.users[uid];
        const groupId = adminData.groupId;
        const selectedUid = target.value || null;

        if (selectedUid && (!state.users[selectedUid] || state.users[selectedUid].groupId !== groupId)) {
          alert("Der Nutzer muss zur gleichen Gruppe gehören.");
          target.value = adminData.assignedUserUid || "";
          return;
        }

        update(ref(db, `users/${uid}`), { assignedUserUid: selectedUid || null }).catch((error) => {
          console.error("Fehler beim Speichern der Zuweisung:", error);
          alert("Zuweisung konnte nicht gespeichert werden.");
        });
      }
    }

    function renderUserList() {
      const userListDiv = document.getElementById("user-list");
      if (!userListDiv || !state.currentUser) return;

      updateAdminSections();

      const isSuperAdmin = state.currentUser.role === "super-admin";
      const isRestrictedAdmin = state.currentUser.role === "restricted-admin";
      const myGroupId = state.currentUser.groupId || null;

      const entries = Object.entries(state.users || {});
      const filteredEntries = entries.filter(([uid, user]) => {
        const role = resolveRole(user);
        if (uid === state.currentUser.uid) return false;
        if (isSuperAdmin) return role !== "super-admin";
        if (isRestrictedAdmin) return role === "user" && user.groupId && user.groupId === myGroupId;
        return false;
      });

      filteredEntries.sort((a, b) => {
        const emailA = (a[1].email || "").toLowerCase();
        const emailB = (b[1].email || "").toLowerCase();
        return emailA.localeCompare(emailB);
      });

      if (!filteredEntries.length) {
        userListDiv.innerHTML = '<p class="info-text">Keine Benutzer zum Anzeigen.</p>';
        return;
      }

      userListDiv.innerHTML = "";
      const fragment = document.createDocumentFragment();

      filteredEntries.forEach(([uid, user]) => {
        const role = resolveRole(user);
        const card = document.createElement("div");
        card.className = "user-card";
        card.dataset.uid = uid;

        const groupName = user.groupId ? (state.groups[user.groupId]?.name || "Unbekannte Gruppe") : "Keine Gruppe";
        let cardHtml = `
          <h3>${escapeHtml(user.email || "Unbenannter Nutzer")} ${renderRoleBadge(role)}</h3>
          <p class="meta-line"><span class="meta-label">Gruppe:</span> ${escapeHtml(groupName)}</p>
        `;

        if (isSuperAdmin && role !== "super-admin") {
          cardHtml += `
            <label class="inline-label">Gruppe ändern:
              <select class="group-select" data-uid="${uid}">
                ${createGroupOptionsHTML(user.groupId || "")}
              </select>
            </label>
          `;
        }

        if (role === "restricted-admin") {
          const assignedUser = user.assignedUserUid ? state.users[user.assignedUserUid] : null;
          const assignedEmail = assignedUser?.email || "Kein Nutzer zugewiesen";
          cardHtml += `<p class="meta-line"><span class="meta-label">Zugewiesener Nutzer:</span> ${escapeHtml(assignedEmail)}</p>`;
          if (isSuperAdmin) {
            cardHtml += `
              <label class="inline-label">Nutzer zuweisen:
                <select class="assigned-user-select" data-uid="${uid}" data-group="${user.groupId || ""}">
                  ${createAssignedUserOptionsHTML(user.groupId || "", user.assignedUserUid || "")}
                </select>
              </label>
            `;
          }
        }

        // Add Delete Button for Super Admins
        if (isSuperAdmin) {
           cardHtml += `<button class="delete-user-btn" data-uid="${uid}" style="margin-top:10px; border-color:red; color:red;">Nutzer löschen</button>`;
        }

        if (role === "user") {
          const timerInfo = buildTimerInfo(user, uid);
          cardHtml += timerInfo.statusHtml;

          const canControl = isSuperAdmin || (isRestrictedAdmin && uid === state.currentUser.assignedUserUid && user.groupId === myGroupId);
          if (canControl) {
            cardHtml += buildTimerControls(uid, timerInfo, { allowSubtract: isSuperAdmin });
          } else if (isRestrictedAdmin) {
            cardHtml += `<p class="restricted-note">Timer kann nur für deinen zugewiesenen Nutzer gesteuert werden.</p>`;
          }
        }

        card.innerHTML = cardHtml;
        fragment.appendChild(card);
      });

      userListDiv.appendChild(fragment);
    }

    function buildTimerInfo(user, uid) {
      const timer = user.timer || {};
      const now = Date.now();
      const initialDurationMinutes = Number.isFinite(timer.initialDuration)
        ? Math.max(1, Math.round(timer.initialDuration / 60))
        : 120;

      let statusHtml = '<p class="timer-inactive">Timer inaktiv</p>';
      let isPaused = false;
      let isActive = false;
      let pausedSeconds = null;
      const timerStatus = timer?.status;
      let pauseVariant = null;

      if (Number.isFinite(timer.pausedRemainingSeconds)) {
        isPaused = true;
        pausedSeconds = Math.max(0, Math.floor(timer.pausedRemainingSeconds));
      }

      if (timer && timer.endTime) {
        const diffMs = timer.endTime - now;
        if (diffMs > 0) {
          isActive = true;
          statusHtml = `<p class="timer-active" data-end-time="${timer.endTime}" data-uid="${uid}">Lädt...</p>`;
        } else {
          const totalSeconds = Number.isFinite(timer.initialDuration) ? Math.floor(timer.initialDuration) : null;
          const totalLabel = totalSeconds != null ? formatDuration(totalSeconds) : "--:--";
          statusHtml = `<p class="timer-paused-lose">Spiel verloren · Gesamtdauer: ${totalLabel}</p>`;
        }
      }

      if (isPaused) {
        pauseVariant = "paused";
        const winPaused = timerStatus === "win-paused" || (user?.lastGame?.result === "win" && Number.isFinite(user.lastGame?.remainingSeconds));
        const losePaused = timerStatus === "lose-paused" || (user?.lastGame?.result === "lose" && (Number.isFinite(user?.lastGame?.finishedAt) || Number.isFinite(pausedSeconds)));

        if (winPaused) pauseVariant = "win";
        else if (losePaused) pauseVariant = "lose";

        const secondsForDisplay = (() => {
          if (pauseVariant === "lose" && Number.isFinite(timer.initialDuration)) {
            return Math.max(0, Math.floor(timer.initialDuration));
          }
          if (Number.isFinite(pausedSeconds)) return pausedSeconds;
          if (pauseVariant === "win" && Number.isFinite(user?.lastGame?.remainingSeconds)) {
            return Math.max(0, Math.floor(user.lastGame.remainingSeconds));
          }
          if (Number.isFinite(user?.lastGame?.remainingSeconds)) {
            return Math.max(0, Math.floor(user.lastGame.remainingSeconds));
          }
          return 0;
        })();
        const pauseClass = pauseVariant === "win"
          ? "timer-paused-win"
          : pauseVariant === "lose"
            ? "timer-paused-lose"
            : "timer-paused";
        const pauseLabel = pauseVariant === "win"
          ? "Gewonnen"
          : pauseVariant === "lose"
            ? "Verloren"
            : "Pausiert";
        statusHtml = `<p class="${pauseClass}">${pauseLabel}: ${formatDuration(secondsForDisplay)}</p>`;
      }

      const solvedSeconds = extractSolvedSeconds(user.solvedStats);
      if (typeof solvedSeconds === "number") {
        const formatted = formatDuration(solvedSeconds);
        statusHtml += `<p class="solved-info">Gelöst mit ${formatted} Restzeit.</p>`;
      }

      return { statusHtml, initialDurationMinutes, isPaused, isActive, pausedSeconds, pauseVariant };
    }

    function buildTimerControls(uid, timerInfo, options = {}) {
      const allowSubtract = options.allowSubtract;
      const minutesValue = Number.isFinite(timerInfo.initialDurationMinutes) && timerInfo.initialDurationMinutes > 0
        ? timerInfo.initialDurationMinutes
        : 120;
      let pauseState = timerInfo.isPaused ? "paused" : timerInfo.isActive ? "running" : "idle";
      let pauseLabel = timerInfo.isPaused ? "Weiter" : "Pause";
      let pauseDisabledAttr = pauseState === "idle" ? " disabled" : "";

      if (timerInfo.pauseVariant === "win") {
        pauseLabel = "Gewonnen";
        pauseDisabledAttr = " disabled";
        pauseState = "win";
      } else if (timerInfo.pauseVariant === "lose") {
        pauseLabel = "Verloren";
        pauseDisabledAttr = " disabled";
        pauseState = "lose";
      }
      return `
        <div class="controls-grid">
          <div class="timer-start-group">
            <input type="number" class="timer-input" id="timer-input-${uid}" placeholder="Minuten" min="1" value="${minutesValue}">
            <button class="start-btn" data-uid="${uid}">Start</button>
          </div>
          <div class="timer-adjust-group">
            <button class="add-time-btn" data-uid="${uid}">+10 Min</button>
            ${allowSubtract ? `<button class="subtract-time-btn" data-uid="${uid}">-10 Min</button>` : ""}
            <button class="pause-resume-btn" data-uid="${uid}" data-state="${pauseState}"${pauseDisabledAttr}>${pauseLabel}</button>
          </div>
        </div>
      `;
    }

    function createGroupOptionsHTML(selectedGroupId) {
      const options = ['<option value="">Keine Gruppe</option>'];
      const entries = Object.entries(state.groups || {}).sort((a, b) => {
        const nameA = (a[1].name || a[0]).toLowerCase();
        const nameB = (b[1].name || b[0]).toLowerCase();
        return nameA.localeCompare(nameB);
      });
      entries.forEach(([groupId, group]) => {
        const selected = groupId === selectedGroupId ? "selected" : "";
        options.push(`<option value="${groupId}" ${selected}>${escapeHtml(group.name || groupId)}</option>`);
      });
      return options.join("");
    }

    function createAssignedUserOptionsHTML(groupId, selectedUid) {
      const options = ['<option value="">Kein Nutzer</option>'];
      if (!groupId) { options.push('<option value="" disabled>Bitte zuerst Gruppe wählen</option>'); return options.join(""); }

      const members = Object.entries(state.users || {}).filter(([uid, user]) => resolveRole(user) === "user" && user.groupId === groupId)
        .sort((a, b) => ((a[1].email || "").toLowerCase()).localeCompare((b[1].email || "").toLowerCase()));

      if (!members.length) options.push('<option value="" disabled>Keine Nutzer in dieser Gruppe</option>');
      else members.forEach(([uid, user]) => {
        const selected = uid === selectedUid ? "selected" : "";
        options.push(`<option value="${uid}" ${selected}>${escapeHtml(user.email || uid)}</option>`);
      });
      return options.join("");
    }

    function renderGroupOptions() {
      const userGroupSelect = document.getElementById("new-user-group");
      populateGroupSelect(userGroupSelect);
      const restrictedGroupSelect = document.getElementById("restricted-admin-group");
      populateGroupSelect(restrictedGroupSelect, "Bitte Gruppe wählen");
      const assignedSelect = document.getElementById("restricted-admin-assigned");
      if (restrictedGroupSelect) populateAssignedUserSelect(assignedSelect, restrictedGroupSelect.value);
    }

    function populateGroupSelect(selectEl, placeholder = "Keine Gruppe") {
      if (!selectEl) return;
      const currentValue = selectEl.value;
      const entries = Object.entries(state.groups || {}).sort((a, b) => {
        const nameA = (a[1].name || a[0]).toLowerCase();
        const nameB = (b[1].name || b[0]).toLowerCase();
        return nameA.localeCompare(nameB);
      });
      selectEl.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>`;
      entries.forEach(([groupId, group]) => {
        const option = document.createElement("option");
        option.value = groupId; option.textContent = group.name || groupId;
        selectEl.appendChild(option);
      });
      if (currentValue && selectEl.querySelector(`option[value="${currentValue}"]`)) selectEl.value = currentValue;
    }

    function populateAssignedUserSelect(selectEl, groupId) {
      if (!selectEl) return;
      const currentValue = selectEl.value;
      selectEl.innerHTML = createAssignedUserOptionsHTML(groupId, currentValue);
      if (currentValue && selectEl.querySelector(`option[value="${currentValue}"]`)) selectEl.value = currentValue;
    }

    function refreshCreationFormUserOptions() {
      const restrictedGroupSelect = document.getElementById("restricted-admin-group");
      const assignedSelect = document.getElementById("restricted-admin-assigned");
      if (restrictedGroupSelect && assignedSelect) populateAssignedUserSelect(assignedSelect, restrictedGroupSelect.value);
    }

    function renderCompletedGroups() {
      const section = document.getElementById("completed-groups-section");
      const listContainer = document.getElementById("completed-groups");
      if (!section || !listContainer || !state.currentUser) return;

      const completedGroups = Object.entries(state.groups || {}).filter(([, group]) => group.completedAt);
      if (!completedGroups.length) { section.style.display = "none"; listContainer.innerHTML = ""; return; }

      completedGroups.sort((a, b) => (a[1].completedAt || 0) - (b[1].completedAt || 0));
      const rows = completedGroups.map(([groupId, group]) => {
        const name = escapeHtml(group.name || groupId);
        const duration = formatDuration(group.completionDurationSec);
        const finishedAt = formatTimestamp(group.completedAt);
        return `
          <div class="group-row">
            <span class="group-name">${name}</span>
            <span class="group-duration">${duration || "—"}</span>
            <span class="group-finished-at">${finishedAt || ""}</span>
          </div>
        `;
      });

      section.style.display = "block";
      listContainer.innerHTML = rows.join("");
    }

    // --------- ROBUSTE "LETZTE SPIELE" ----------
    function renderLastGames() {
      const section = document.getElementById("last-games-section");
      const listContainer = document.getElementById("last-games");
      if (!section || !listContainer || !state.currentUser) return;

      const isSuperAdmin = state.currentUser.role === "super-admin";
      const targetGroupId = state.currentUser.groupId || null;

      const entries = [];
      for (const [uid, user] of Object.entries(state.users || {})) {
        const role = resolveRole(user);
        if (role !== "user") continue; // nur "user" wie gewünscht

        // Sichtbarkeit je nach Admin-Typ
        if (state.currentUser.role === "restricted-admin") {
          if (!user.groupId || user.groupId !== targetGroupId) continue;
        }

        const lastGame = user.lastGame || {};
        const solvedStats = user.solvedStats || {};
        const puzzles = user.puzzles || {};
        const timer = user.timer || {};

        const finishedAt =
          (Number.isFinite(lastGame.finishedAt) && lastGame.finishedAt) ||
          (Number.isFinite(solvedStats.finishedAt) && solvedStats.finishedAt) ||
          (Number.isFinite(timer.pausedAt) && timer.pausedAt) ||
          null;

        if (!finishedAt) continue; // wirklich nur abgeschlossene Läufe

        // Ergebnis priorisieren: lastGame.result -> puzzles.virusDeactivated -> unbekannt
        let result = lastGame.result || null;
        if (!result) {
          if (timer.status === "win-paused") result = "win";
          else if (timer.status === "lose-paused") result = "lose";
          else if (puzzles.virusDeactivated === true) result = "win";
          else if (Number.isFinite(timer.pausedRemainingSeconds) && timer.pausedRemainingSeconds === 0) result = "lose";
          else result = "unknown";
        }

        let remainingSeconds =
          (typeof lastGame.remainingSeconds === "number" ? lastGame.remainingSeconds : null) ??
          (typeof solvedStats.remainingSeconds === "number" ? solvedStats.remainingSeconds : null) ??
          (typeof timer.pausedRemainingSeconds === "number" ? timer.pausedRemainingSeconds : null);

        const totalSeconds =
          (typeof lastGame.totalSeconds === "number" ? lastGame.totalSeconds : null) ??
          (typeof solvedStats.totalSeconds === "number" ? solvedStats.totalSeconds : null) ??
          (typeof timer.initialDuration === "number" ? timer.initialDuration : null);

        if (result === "lose") remainingSeconds = 0;
        else if (!Number.isFinite(remainingSeconds) && Number.isFinite(totalSeconds)) {
          remainingSeconds = totalSeconds;
        }

        entries.push({
          uid,
          email: user.email || uid,
          groupId: user.groupId || null,
          groupName: user.groupId ? (state.groups[user.groupId]?.name || "Unbekannte Gruppe") : "Keine Gruppe",
          finishedAt,
          result,
          remainingSeconds,
          totalSeconds
        });
      }

      section.style.display = "block";

      if (!entries.length) {
        listContainer.innerHTML = '<p class="info-text">Noch keine abgeschlossenen Spiele.</p>';
        syncPublicLastGames([]);
        return;
      }

      entries.sort((a, b) => {
        const remainingA = Number.isFinite(a.remainingSeconds) ? a.remainingSeconds : (a.result === "lose" ? 0 : -1);
        const remainingB = Number.isFinite(b.remainingSeconds) ? b.remainingSeconds : (b.result === "lose" ? 0 : -1);
        if (remainingA !== remainingB) return remainingB - remainingA;
        return (b.finishedAt || 0) - (a.finishedAt || 0);
      });

      const headerCells = [
        '<span class="last-game-user">Nutzer</span>',
        ...(isSuperAdmin ? ['<span class="last-game-group">Gruppe</span>'] : []),
        '<span class="last-game-duration">Restzeit</span>',
        '<span class="last-game-result">Ergebnis</span>',
        '<span class="last-game-date">Datum</span>'
      ];
      const header = `<div class="last-game-row last-game-header">${headerCells.join("")}</div>`;

      const rows = entries.map((e) => {
        const resultInfo = formatLastGameResult(e.result);
        const finishedAt = formatTimestamp(e.finishedAt);
        const durationValue = (() => {
          if (e.result === "lose") return "00:00";
          if (Number.isFinite(e.remainingSeconds)) return formatDuration(e.remainingSeconds);
          return "—";
        })();
        const durationClasses = ["last-game-duration"];
        if (e.result === "win") durationClasses.push("last-game-duration-win");
        else if (e.result === "lose") durationClasses.push("last-game-duration-lose");
        const cells = [
          `<span class="last-game-user">${escapeHtml(e.email)}</span>`,
          ...(isSuperAdmin ? [`<span class="last-game-group">${escapeHtml(e.groupName)}</span>`] : []),
          `<span class="${durationClasses.join(' ')}">${durationValue}</span>`,
          `<span class="last-game-result ${resultInfo.className}">${resultInfo.label}</span>`,
          `<span class="last-game-date">${finishedAt || ""}</span>`
        ];
        return `<div class="last-game-row">${cells.join("")}</div>`;
      });

      listContainer.innerHTML = header + rows.join("");
      syncPublicLastGames(entries);
    }

    function formatLastGameResult(result) {
      if (result === "win") return { label: "Gewonnen", className: "last-game-result-win" };
      if (result === "lose") return { label: "Verloren", className: "last-game-result-lose" };
      return { label: "Unbekannt", className: "" };
    }

    const PUBLIC_LAST_GAMES_LIMIT = 20;
    let lastPublicLastGamesSignature = null;

    async function syncPublicLastGames(entries) {
      let serialized = null;
      try {
        if (!state.currentUser) return;
        const canWritePublic = state.currentUser.isAdmin === true || state.currentUser.role === "super-admin";
        if (!canWritePublic) return;

        const sanitized = (entries || [])
          .slice(0, PUBLIC_LAST_GAMES_LIMIT)
          .map((entry) => {
            const result = entry.result || "unknown";
            let remainingSeconds = Number.isFinite(entry.remainingSeconds) ? Math.max(0, Math.floor(entry.remainingSeconds)) : null;
            const totalSeconds = Number.isFinite(entry.totalSeconds) ? Math.max(0, Math.floor(entry.totalSeconds)) : null;
            if (result === "lose") remainingSeconds = 0;
            else if (!Number.isFinite(remainingSeconds) && Number.isFinite(totalSeconds) && result === "win") {
              remainingSeconds = totalSeconds;
            }
            return {
              finishedAt: Number.isFinite(entry.finishedAt) ? Number(entry.finishedAt) : 0,
              result,
              remainingSeconds,
              totalSeconds,
              player: entry.email || "",
              group: entry.groupName || ""
            };
          });

        serialized = JSON.stringify(sanitized);
        if (serialized === lastPublicLastGamesSignature) return;

        const payload = {
          name: "lastGames",
          createdAt: Date.now(),
          status: serialized
        };

        await set(ref(db, "publicOverview/lastGames"), payload);
        lastPublicLastGamesSignature = serialized;
      } catch (error) {
        console.error("Fehler beim Schreiben der öffentlichen Übersicht:", error);
      }
    }

    function updateAllTimersOnPage() {
      const runningTimers = document.querySelectorAll(".timer-active[data-end-time]");
      runningTimers.forEach((el) => {
        const endTime = parseInt(el.dataset.endTime, 10);
        const remainingMs = endTime - Date.now();
        if (Number.isNaN(endTime)) return;

        if (remainingMs <= 0) {
          const uid = el.dataset.uid;
          const totalSeconds = (() => {
            if (!uid || !state.users[uid]) return null;
            const timer = state.users[uid]?.timer;
            if (timer && Number.isFinite(timer.initialDuration)) {
              return Math.floor(timer.initialDuration);
            }
            return null;
          })();
          el.textContent = totalSeconds != null
            ? `Spiel verloren · Gesamtdauer: ${formatDuration(totalSeconds)}`
            : "Spiel verloren";
          el.classList.remove("timer-active");
          el.classList.add("timer-paused-lose");
          el.removeAttribute("data-end-time");
          return;
        }

        const remainingSec = Math.floor(remainingMs / 1000);
        el.textContent = "Läuft: " + formatDuration(remainingSec);
      });
    }

    function canCurrentAdminControlUser(uid) {
      if (!state.currentUser) return false;
      if (state.currentUser.role === "super-admin") return true;
      if (state.currentUser.role === "restricted-admin") {
        const targetUser = state.users[uid];
        if (!targetUser) return false;
        const role = resolveRole(targetUser);
        return role === "user" &&
          state.currentUser.assignedUserUid == uid && // Use loose equality for ID matching
          targetUser.groupId &&
          targetUser.groupId === state.currentUser.groupId;
      }
      return false;
    }

    function resolveRole(user) {
      if (!user) return "user";
      if (user.role) return user.role;
      return user.isAdmin ? "super-admin" : "user";
    }

    function renderRoleBadge(role) {
      let label = "Nutzer";
      if (role === "super-admin") label = "Super-Admin";
      if (role === "restricted-admin") label = "Eingeschränkt";
      return `<span class="role-badge role-${role}">${label}</span>`;
    }

    function extractSolvedSeconds(solvedStats) {
      if (!solvedStats) return null;
      if (typeof solvedStats.remainingSeconds === "number") return solvedStats.remainingSeconds;
      if (typeof solvedStats.remainingTimeOnSolve === "number") return solvedStats.remainingTimeOnSolve;
      return null;
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "";
      const totalSeconds = Math.floor(seconds);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const mmss = `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return hours > 0 ? `${String(hours).padStart(2, "0")}:${mmss}` : mmss;
    }

    function formatTimestamp(timestamp) {
      if (!Number.isFinite(timestamp)) return "";
      try {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString("de-DE");
      } catch { return ""; }
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return map[char] || char;
      });
    }

    function setFeedback(element, message) {
      if (!element) return;
      element.textContent = message;
      if (message) {
        setTimeout(() => { if (element.textContent === message) element.textContent = ""; }, 5000);
      }
    }

    function parseFirebaseError(error) {
      if (!error || !error.code) return "Unbekannter Fehler.";
      switch (error.code) {
        case "auth/email-already-in-use": return "Diese E-Mail-Adresse wird bereits verwendet.";
        case "auth/invalid-email": return "Die eingegebene E-Mail-Adresse ist ungültig.";
        case "auth/weak-password": return "Das Passwort ist zu schwach (mind. 6 Zeichen).";
        default: return "Aktion fehlgeschlagen. Bitte erneut versuchen.";
      }
    }

    function updateAdminSections() {
      if (!state.currentUser) return;
      const superSection = document.getElementById("super-admin-section");
      const hintSection = document.getElementById("restricted-admin-hint");

      if (superSection) superSection.style.display = state.currentUser.role === "super-admin" ? "block" : "none";

      if (hintSection) {
        if (state.currentUser.role === "restricted-admin") {
          const groupName = state.currentUser.groupId ? (state.groups[state.currentUser.groupId]?.name || "Unbekannte Gruppe") : "Keine Gruppe";
          const assignedUser = state.currentUser.assignedUserUid ? state.users[state.currentUser.assignedUserUid] : null;
          const assignedName = assignedUser?.email || "Kein Nutzer zugewiesen";
          hintSection.style.display = "block";
          hintSection.innerHTML = `
            <h2>Deine Berechtigungen</h2>
            <p>Du kannst alle Timer der Gruppe <strong>${escapeHtml(groupName)}</strong> einsehen.</p>
            <p>Steuern darfst du nur den Timer von <strong>${escapeHtml(assignedName)}</strong>.</p>
          `;
        } else {
          hintSection.style.display = "none";
          hintSection.innerHTML = "";
        }
      }
    }
  </script>
</body>
</html>
