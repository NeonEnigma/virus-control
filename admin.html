<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { background-color: #000; color: #0f0; font-family: monospace; padding: 20px; word-wrap: break-word; }
    h1, h2, h3 { color: #0f0; text-shadow: 0 0 5px #0f0; margin-top: 0; }
    #admin-dashboard { display: none; }
    .admin-section { border: 1px solid #0f0; background-color: #050505; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
    .form-grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .form-card { flex: 1 1 280px; min-width: 260px; border: 1px solid #0f0; padding: 15px; border-radius: 6px; background-color: #080808; }
    label { display: block; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], select {
      width: 100%; padding: 6px; background-color: #111; color: #0f0; border: 1px solid #0f0; border-radius: 4px; font-family: monospace; margin-bottom: 10px; box-sizing: border-box;
    }
    button { background: #000; border: 2px solid #0f0; color: #0f0; padding: 6px 12px; font-family: monospace; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0f0; color: #000; }
    .form-feedback { min-height: 18px; color: #0ff; font-size: 0.9rem; }
    .user-card { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background-color: #050505; border-radius: 6px; }
    .user-card h3 { margin: 0 0 10px; color: #fff; }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; border: 1px solid currentColor; font-size: 0.75rem; vertical-align: middle; margin-left: 8px; }
    .role-user { color: #0ff; } .role-restricted-admin { color: #ff0; } .role-super-admin { color: #f0f; }
    .meta-line { margin: 4px 0; } .meta-label { color: #bbb; }
    .inline-label { display: block; margin: 10px 0; }
    .controls-grid { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-top: 15px; }
    .timer-start-group { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
    .timer-adjust-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .timer-input { width: 90px; }
    .timer-active { color: #ff0; font-weight: bold; }
    .timer-inactive { color: #888; }
    .timer-paused { color: #0ff; }
    .timer-paused-win { color: #0f0; font-weight: bold; }
    .timer-paused-lose { color: #f66; font-weight: bold; }
    .solved-info { color: #0ff; }
    .restricted-note { color: #ccc; font-size: 0.9rem; margin-top: 10px; }
    .info-text { margin: 0; color: #bbb; }
    #completed-groups-section { display: none; }
    #last-games-section { display: none; }
    .group-row { display: flex; justify-content: space-between; border-bottom: 1px solid #0f0; padding: 6px 0; font-size: 0.95rem; }
    .group-row span { flex: 1; }
    .group-name { font-weight: bold; color: #fff; }
    .group-duration { text-align: center; color: #0ff; }
    .group-finished-at { text-align: right; color: #bbb; }
    .last-game-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(0, 255, 0, 0.2); font-size: 0.95rem; }
    .last-game-header { font-weight: bold; border-bottom: 2px solid rgba(0, 255, 0, 0.5); }
    .last-game-row span { flex: 1; }
    .last-game-user { flex: 2; color: #fff; }
    .last-game-group { flex: 1.5; color: #bbb; }
    .last-game-duration { flex: 1; color: #0ff; }
    .last-game-duration-win { color: #0f0; font-weight: bold; }
    .last-game-duration-lose { color: #f66; font-weight: bold; }
    .last-game-result { flex: 1; }
    .last-game-date { flex: 1.5; text-align: right; color: #bbb; }
    .last-game-result-win { color: #0f0; }
    .last-game-result-lose { color: #f66; }
    @media (max-width: 768px) {
      body { padding: 12px; font-size: 16px; }
      .form-grid { flex-direction: column; }
      .timer-start-group, .timer-adjust-group { flex-direction: column; align-items: stretch; }
      button { width: 100%; box-sizing: border-box; }
      .timer-input { width: 100%; }
      .group-row { flex-direction: column; align-items: flex-start; gap: 4px; }
      .group-duration, .group-finished-at { text-align: left; }
      .last-game-row { flex-direction: column; align-items: flex-start; }
      .last-game-date { text-align: left; }
    }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <div id="loading-message">Prüfe Berechtigung...</div>

  <div id="admin-dashboard">
    <section id="super-admin-section" class="admin-section">
      <h2>Benutzer- und Gruppenverwaltung</h2>
      <div class="form-grid">
        <form id="create-group-form" class="form-card">
          <h3>Neue Gruppe</h3>
          <label for="new-group-name">Gruppenname</label>
          <input type="text" id="new-group-name" placeholder="z. B. Team Alpha" required />
          <button type="submit">Gruppe anlegen</button>
          <p class="form-feedback" id="group-feedback"></p>
        </form>

        <form id="create-user-form" class="form-card">
          <h3>Normalen Nutzer anlegen</h3>
          <label for="new-user-email">E-Mail</label>
          <input type="email" id="new-user-email" placeholder="nutzer@example.com" required />
          <label for="new-user-password">Passwort</label>
          <input type="password" id="new-user-password" placeholder="Passwort" required />
          <label for="new-user-group">Gruppe</label>
          <select id="new-user-group">
            <option value="">Keine Gruppe</option>
          </select>
          <button type="submit">Nutzer erstellen</button>
          <p class="form-feedback" id="create-user-feedback"></p>
        </form>

        <form id="create-restricted-admin-form" class="form-card">
          <h3>Eingeschränkten Admin anlegen</h3>
          <label for="restricted-admin-email">E-Mail</label>
          <input type="email" id="restricted-admin-email" placeholder="admin@example.com" required />
          <label for="restricted-admin-password">Passwort</label>
          <input type="password" id="restricted-admin-password" placeholder="Passwort" required />
          <label for="restricted-admin-group">Gruppe</label>
          <select id="restricted-admin-group" required>
            <option value="">Bitte Gruppe wählen</option>
          </select>
          <label for="restricted-admin-assigned">Zugeordneter Nutzer</label>
          <select id="restricted-admin-assigned">
            <option value="">Kein Nutzer</option>
          </select>
          <button type="submit">Eingeschränkten Admin erstellen</button>
          <p class="form-feedback" id="restricted-admin-feedback"></p>
        </form>
      </div>
    </section>

    <section id="restricted-admin-hint" class="admin-section" style="display: none;"></section>

    <h2>Benutzerübersicht</h2>
    <div id="user-list"></div>

    <section id="completed-groups-section" class="admin-section">
      <h2>Fertige Gruppen</h2>
      <div id="completed-groups"></div>
    </section>

    <section id="last-games-section" class="admin-section">
      <h2>Letzte Spiele</h2>
      <div id="last-games"></div>
    </section>
  </div>
