<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <style>
    /* Fügen Sie hier Ihr Admin-spezifisches CSS ein */
    body { background-color: #000000; color: #0f0; font-family: monospace; }
    #admin-dashboard { display: none; /* Standardmäßig ausgeblendet */ }
  </style>
</head>
<body>

  <h1>Admin Dashboard</h1>
  <div id="loading-message">Prüfe Berechtigung...</div>

  <div id="admin-dashboard">
    <h2>Benutzerübersicht</h2>
    <div id="user-list">
      </div>
  </div>


  <script type="module">
    // Firebase initialisieren (genau wie auf der Login-Seite)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // onAuthStateChanged ist der "Live-Checker" für den Login-Status
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Jemand ist angemeldet. Jetzt prüfen wir, ob er ein Admin ist.
        const userRef = ref(db, 'users/' + user.uid);
        onValue(userRef, (snapshot) => {
          const userData = snapshot.val();
          if (userData && userData.isAdmin === true) {
            // ALLES OK! Der Benutzer ist ein Admin.
            console.log("Admin-Zugriff bestätigt.");
            // Blende die Lade-Nachricht aus und zeige das Dashboard an.
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            // HIER würden Sie die Funktion aufrufen, die das Dashboard mit Leben füllt.
          } else {
            // Der Benutzer ist angemeldet, aber kein Admin. RAUS!
            console.log("Zugriff verweigert: Benutzer ist kein Admin.");
            window.location.href = 'index.html';
          }
        }, { onlyOnce: true });

      } else {
        // Niemand ist angemeldet. RAUS!
        console.log("Zugriff verweigert: Kein Benutzer angemeldet.");
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
