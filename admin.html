<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { 
      background-color: #000000; 
      color: #0f0; 
      font-family: monospace; 
      padding: 20px;
      word-wrap: break-word; /* Verhindert horizontales Scrollen bei langen Wörtern */
    }
    h1, h2 {
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }
    #admin-dashboard { 
      display: none;
    }
    .user-card {
      border: 2px solid #0f0;
      padding: 15px;
      margin-bottom: 20px;
      background-color: #050505;
    }
    .user-card h3 {
      margin-top: 0;
      color: #fff;
    }
    .user-card p {
      margin: 5px 0;
    }
    
    /* NEU: Flexbox-Layout für die Steuerungselemente */
    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-top: 15px;
    }
    .timer-start-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1; /* Nimmt verfügbaren Platz ein */
    }
    .timer-adjust-group {
      display: flex;
      gap: 10px;
    }
    .timer-input {
      width: 80px;
      padding: 6px;
      background-color: #222;
      color: #0f0;
      border: 1px solid #0f0;
      font-family: monospace;
      border-radius: 4px;
    }
    .user-card button {
      background: #000;
      border: 2px solid #0f0;
      color: #0f0;
      padding: 6px 12px;
      font-family: monospace;
      cursor: pointer;
    }
    .user-card button:hover {
      background: #0f0;
      color: #000;
    }
    .timer-active {
        color: #ff0;
        font-weight: bold;
    }
    .timer-inactive {
        color: #888;
    }
    .solved-info {
        color: #0ff;
    }

    /* NEU: Media Query für Responsive Design auf mobilen Geräten */
    @media (max-width: 768px) {
      body {
        padding: 10px;
        font-size: 16px;
      }
      .user-card h3 {
        font-size: 1.2em;
      }
      .controls-grid, .timer-adjust-group {
        flex-direction: column;
        align-items: stretch; /* Streckt Elemente auf volle Breite */
      }
      .user-card button {
        width: 100%;
        padding: 12px;
        box-sizing: border-box; /* Stellt sicher, dass Padding in der Breite enthalten ist */
      }
      .timer-input {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        padding: 10px;
        margin-bottom: 5px;
      }
    }
  </style>
</head>
<body>

  <h1>Admin Dashboard</h1>
  <div id="loading-message">Prüfe Berechtigung...</div>

  <div id="admin-dashboard">
    <h2>Benutzerübersicht</h2>
    <div id="user-list">
      </div>
  </div>


  <script type="module">
    // Firebase initialisieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    let masterTimerInterval = null;

    // "Türsteher"-Skript
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userRef = ref(db, 'users/' + user.uid);
        onValue(userRef, (snapshot) => {
          const userData = snapshot.val();
          if (userData && userData.isAdmin === true) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            initializeDashboard();
            if (masterTimerInterval) clearInterval(masterTimerInterval);
            masterTimerInterval = setInterval(updateAllTimersOnPage, 1000);
          } else {
            window.location.href = 'index.html';
          }
        }, { onlyOnce: true });
      } else {
        window.location.href = 'index.html';
      }
    });

    // Baut das Dashboard und hält es aktuell
    function initializeDashboard() {
      const usersRef = ref(db, 'users');
      const userListDiv = document.getElementById('user-list');

      onValue(usersRef, (snapshot) => {
        const users = snapshot.val();
        userListDiv.innerHTML = ''; 

        for (const uid in users) {
          const user = users[uid];
          if (user.isAdmin) continue;

          let timerStatusHTML = '<p class="timer-inactive">Timer inaktiv</p>';
          if (user.timer && user.timer.endTime) {
            const diffMs = user.timer.endTime - Date.now();
            if (diffMs > 0) {
              timerStatusHTML = `<p class="timer-active" data-end-time="${user.timer.endTime}">Lädt...</p>`;
            } else {
              timerStatusHTML = '<p class="timer-inactive">Timer abgelaufen</p>';
            }
          }
          
          let solvedStatusHTML = '';
          if (user.solvedStats && user.solvedStats.remainingTimeOnSolve) {
            solvedStatusHTML = `<p class="solved-info">Gelöst mit ${Math.floor(user.solvedStats.remainingTimeOnSolve / 60)} min Restzeit.</p>`;
          }
          
          // NEU: Lese die gespeicherte Dauer oder setze einen Standardwert (z.B. 120 Minuten)
          const initialDurationInMinutes = (user.timer && user.timer.initialDuration) ? Math.round(user.timer.initialDuration / 60) : 120;

          const userCard = document.createElement('div');
          userCard.className = 'user-card';
          // NEU: Angepasstes HTML mit Input-Feld
          userCard.innerHTML = `
            <h3>${user.email}</h3>
            ${timerStatusHTML}
            ${solvedStatusHTML}
            <div class="controls-grid">
              <div class="timer-start-group">
                <input type="number" class="timer-input" id="timer-input-${uid}" placeholder="Minuten" value="${initialDurationInMinutes}">
                <button class="start-btn" data-uid="${uid}">Start</button>
              </div>
              <div class="timer-adjust-group">
                <button class="add-time-btn" data-uid="${uid}">+10 Min</button>
                <button class="subtract-time-btn" data-uid="${uid}">-10 Min</button>
                <button class="stop-btn" data-uid="${uid}">Stopp</button>
              </div>
            </div>
          `;
          
          userListDiv.appendChild(userCard);
        }
      });
    }

    function updateAllTimersOnPage() { /* ... unverändert ... */ const t=document.querySelectorAll(".timer-active[data-end-time]");t.forEach(t=>{const e=parseInt(t.dataset.endTime,10),n=Date.now(),o=e-n;if(o<=0)return t.textContent="Timer abgelaufen",t.classList.remove("timer-active"),t.classList.add("timer-inactive"),void t.removeAttribute("data-end-time");const a=Math.floor(o/1e3),i=Math.floor(a/3600),d=Math.floor(a%3600/60),l=a%60;t.textContent=`Läuft: ${String(i).padStart(2,"0")}:${String(d).padStart(2,"0")}:${String(l).padStart(2,"0")}`})}

    // Event-Handling für alle Buttons
    document.getElementById('user-list').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      const uid = e.target.dataset.uid;
      if (!uid) return;
      
      const targetUserTimerRef = ref(db, `users/${uid}/timer`);

      // NEU: Angepasste Logik für den Start-Button
      if (e.target.classList.contains('start-btn')) {
        const inputEl = document.getElementById(`timer-input-${uid}`);
        if (!inputEl) return;

        const minutes = parseInt(inputEl.value, 10);
        if (isNaN(minutes) || minutes <= 0) {
          alert("Bitte eine gültige, positive Minutenzahl eingeben.");
          return;
        }

        const durationInSeconds = minutes * 60;
        const newEndTime = Date.now() + durationInSeconds * 1000;

        // Speichere die Endzeit UND die ursprüngliche Dauer
        set(targetUserTimerRef, { endTime: newEndTime, initialDuration: durationInSeconds });
      }

      if (e.target.classList.contains('add-time-btn')) { /* ... unverändert ... */ get(targetUserTimerRef).then(t=>{const e=t.val();e&&e.endTime&&e.endTime>Date.now()?set(targetUserTimerRef,{...e,endTime:e.endTime+6e5}):alert("Timer ist nicht aktiv. Bitte zuerst starten.")})}
      if (e.target.classList.contains('subtract-time-btn')) { /* ... unverändert ... */ get(targetUserTimerRef).then(t=>{const e=t.val();e&&e.endTime&&e.endTime>Date.now()?Date.now()>=e.endTime-6e5?set(targetUserTimerRef,null):set(targetUserTimerRef,{...e,endTime:e.endTime-6e5}):alert("Timer ist nicht aktiv. Zeit kann nicht abgezogen werden.")})}
      if (e.target.classList.contains('stop-btn')) {
        set(targetUserTimerRef, null);
      }
    });
  </script>
</body>
</html>
