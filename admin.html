<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <style>
    body { background-color: #000000; color: #0f0; font-family: monospace; padding: 20px; }
    h1, h2 { color: #0f0; text-shadow: 0 0 5px #0f0; }
    #admin-dashboard { display: none; }
    .user-card { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background-color: #050505; }
    .user-card h3 { margin-top: 0; color: #fff; }
    .user-card p { margin: 5px 0; }
    .user-card button { background: #000; border: 2px solid #0f0; color: #0f0; padding: 6px 12px; font-family: monospace; cursor: pointer; margin-right: 10px; margin-top: 10px; }
    .user-card button:hover { background: #0f0; color: #000; }
  </style>
</head>
<body>

  <h1>Admin Dashboard</h1>
  <div id="loading-message">Prüfe Berechtigung...</div>
  <div id="admin-dashboard">
    <h2>Benutzerübersicht</h2>
    <div id="user-list"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userRef = ref(db, 'users/' + user.uid);
        onValue(userRef, (snapshot) => {
          const userData = snapshot.val();
          if (userData && userData.isAdmin === true) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            initializeDashboard();
          } else {
            window.location.href = 'index.html';
          }
        }, { onlyOnce: true });
      } else {
        window.location.href = 'index.html';
      }
    });

    // ==========================================================
    // DIAGNOSE-VERSION DIESER FUNKTION
    // ==========================================================
    function initializeDashboard() {
      console.log("1. initializeDashboard() wird ausgeführt.");
      const usersRef = ref(db, 'users');
      const userListDiv = document.getElementById('user-list');

      // Lausche auf ALLE Änderungen im 'users'-Ast der Datenbank
      onValue(usersRef, 
        // Erfolgs-Callback
        (snapshot) => {
          console.log("2. Daten für Dashboard erhalten. Snapshot existiert:", snapshot.exists());
          const users = snapshot.val();
          console.log("3. Komplette Benutzerdaten:", users);
          userListDiv.innerHTML = 'Verarbeite Daten...'; 

          let userCount = 0;
          for (const uid in users) {
            const user = users[uid];
            if (user.isAdmin) continue;
            userCount++;
          }
          userListDiv.innerHTML = `${userCount} Benutzer gefunden. (Anzeige-Logik ist für den Test deaktiviert)`;
        },
        // Fehler-Callback
        (error) => {
          console.error("FEHLER BEIM LESEN DER BENUTZERLISTE:", error);
          userListDiv.innerHTML = `<p style="color: red;">Fehler beim Laden der Benutzer: ${error.message}</p>`;
        }
      );
    }
    
    // Die Event-Handling Logik für die Buttons lassen wir für den Test unverändert.
    document.getElementById('user-list').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      const uid = e.target.dataset.uid;
      if (!uid) return;
      const targetUserTimerRef = ref(db, `users/${uid}/timer`);
      if (e.target.classList.contains('start-btn')) {
        const newEndTime = Date.now() + 7200 * 1000;
        set(targetUserTimerRef, { endTime: newEndTime, initialDuration: 7200 });
      }
      if (e.target.classList.contains('add-time-btn')) {
        get(targetUserTimerRef).then((snapshot) => {
          const timerData = snapshot.val();
          if (timerData && timerData.endTime && timerData.endTime > Date.now()) {
            const newEndTime = timerData.endTime + 10 * 60 * 1000;
            set(targetUserTimerRef, { ...timerData, endTime: newEndTime });
          } else {
            alert("Timer ist nicht aktiv. Bitte zuerst starten.");
          }
        });
      }
      if (e.target.classList.contains('stop-btn')) {
        set(targetUserTimerRef, null);
      }
    });
  </script>

</body>
</html>
