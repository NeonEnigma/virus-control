  <style>/* CSS unverändert */ html,body{margin:0;padding:0;width:100%;height:100%;background-color:#000}body{font-family:monospace;color:#fdfdfd;display:flex;flex-direction:column}.back-arrow{text-decoration:none;position:absolute;top:20px;left:20px;font-size:15px;color:#0f0;cursor:pointer;padding:10px;z-index:100;background-color:rgba(0,0,0,.5);border-radius:5px}.back-arrow:hover{background-color:rgba(0,255,0,.2)}.dashboard{flex:1;display:flex;flex-direction:column;padding:20px;box-sizing:border-box;position:relative}.heading{text-align:center;margin-bottom:20px}.heading h1{font-size:2rem;margin-bottom:10px;margin-top:50px}.heading p{margin:5px 0}#coinCounter{font-size:1.2rem;color:#ffd700;margin-top:70px;text-align:center}.labyrinth-wrapper{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:70px}#labyrinth{position:relative;width:fit-content;height:428px;background-color:#333;border:1px solid #0f0;border-radius:10px;padding:5px;box-sizing:border-box}#cellsContainer{display:grid;grid-template-columns:repeat(10,40px);grid-template-rows:repeat(10,40px);gap:2px}.cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:1rem}.wall{background:#555}.empty{background:#222}.coin{background-color:#222;box-shadow:0 2px 5px rgba(0,0,0,.5);color:#000;font-size:1.2rem;display:flex;align-items:center;justify-content:center}#turtleElement{position:absolute;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:top .5s,left .5s;pointer-events:none}#scriptContainer{width:300px;height:457px;text-align:center;display:flex;flex-direction:column}#scriptContainer textarea{width:100%;height:100%;background:#222;color:#fdfdfd;border:1px solid #0f0;border-radius:5px;padding:10px;font-family:monospace;resize:none;box-sizing:border-box}#scriptContainer button{background-color:#0f0;color:#000;padding:10px 20px;border:none;border-radius:7px;font-si     onAuthStateChanged(auth, (user) => {

              initializeLabyrinth(user);
            }

            alert("Zugriff verweigert! Du musst zuerst das Terminal-Rätsel lösen.");

    function initializeLabyrinth(user) { /* ... Ihre Labyrinth-Logik, unverändert ... */ const t=[[" "," ","W","W","W"," ","C"," "," "," "],["W"," "," "," ","W"," ","W"," ","W"," "],[" "," ","W"," "," "," "," "," ","W"," "],[" ","W","W","W"," ","W","W"," "," "," "],[" "," "," "," "," "," ","W","W","W"," "],[" ","W","W","W","W"," "," "," "," "," "],[" "," ","C"," ","W"," ","W","W"," "," "],["W"," ","W"," "," "," "," ","W"," "," "],[" "," ","W"," ","W","W"," "," "," "," "],[" "," "," "," "," "," "," ","W","C"," "]],e=t.length,n=t[0].length;let o=0,a=Promise.resolve();const i={row:0,col:0,move:function(n,o){const a=this.row+n,i=this.col+o;return a<0||a>=e||i<0||i>=n?(showError("Ungültige Bewegung: außerhalb des Labyrinths!"),!1):"W"===t[a][i]?(showError("Bewegung blockiert durch Wand!"),!1):(clearError(),this.row=a,this.col=i,updateTurtlePosition(),!0)},up:function(t=1){for(let e=0;e<t;e++)a=a.then(()=>new Promise(t=>{this.move(-1,0)?setTimeout(t,500):t()}))},down:function(t=1){for(let e=0;e<t;e++)a=a.then(()=>new Promise(t=>{this.move(1,0)?setTimeout(t,500):t()}))},left:function(t=1){for(let e=0;e<t;e++)a=a.then(()=>new Promise(t=>{this.move(0,-1)?setTimeout(t,500):t()}))},right:function(t=1){for(let e=0;e<t;e++)a=a.then(()=>new Promise(t=>{this.move(0,1)?setTimeout(t,500):t()}))},collect:function(){a=a.then(()=>new Promise(e=>{if("C"===t[this.row][this.col]){t[this.row][this.col]=" ",o++,document.getElementById("coinCounter").textContent="Gesammelte Münzen: "+o,renderCells(),clearError(),updateTurtlePosition(),3===o&&update(ref(db,"users/"+user.uid+"/puzzles"),{labyrinthCompleted:!0}).then(()=>{console.log("Webserver-Rätsel-Status in Firebase gespeichert!"),window.location.href="success3920193484.html"})}else showError("Keine Münze hier!");setTimeout(e,500)}))}};function s(t){document.getElementById("errorDisplay").textContent=t}function r(){document.getElementById("errorDisplay").textContent=""}function l(){const e=document.getElementById("cellsContainer");e.innerHT
