<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Server-Verwaltung – Labyrinth Rätsel</title>
  <style>
    /* Browser-Reset & Vollbild */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
    }
    
    /* Grundlegender Stil – Monospace, dunkler Hintergrund */
    body {
      font-family: monospace;
      color: #fdfdfd;
      display: flex;
      flex-direction: column;
    }
    
    /* Zurück-Pfeil oben rechts */
    .back-arrow {
      position: left;
      top: 10px;
      right: 10px;
      font-size: 1rem;
      color: #0f0;
      cursor: pointer;
      z-index: 1000;
      margin: 20px;
    }
    
    /* Haupt-Container */
    .dashboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }
    
    /* Überschrift */
    .heading {
      text-align: center;
      margin-bottom: 20px;
    }
    .heading h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      margin-top: 50px;
    }
    .heading p {
      margin: 5px 0;
    }
    /* Anzeige der gesammelten Münzen */
    #coinCounter {
      font-size: 1.2rem;
      color: #FFD700;
      margin-top: 70px;
      text-align: center;
    }
    
    /* Wrapper für Labyrinth und Script-Eingabe – nebeneinander */
    .labyrinth-wrapper {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-top: 70px;
    }
    
    /* Labyrinth-Container – 10x10 Grid.
       Enthält:
         - #cellsContainer: das statische Raster der Zellen
         - #turtleElement: die Turtle als absolut positioniertes, animiertes Element */
    #labyrinth {
      position: relative;
      width: fit-content;
      height: 428px; /* 10*40 + 9*2 + 2*5 = 428px */
      background-color: #333;
      border: 1px solid #0f0;
      border-radius: 10px;
      padding: 5px;
      box-sizing: border-box;
    }
    #cellsContainer {
      display: grid;
      grid-template-columns: repeat(10, 40px);
      grid-template-rows: repeat(10, 40px);
      gap: 2px;
    }
    .cell {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-size: 1rem;
    }
    .wall {
      background: #555;
    }
    .empty {
      background: #222;
    }
    /* Münzen: Darstellung als Emoji (mit Schatten) */
    .coin {
      background-color: #222;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      color: #000;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Turtle-Element: Absolut positioniert, exakt 40x40px, zentriert in der Zelle */
    #turtleElement {
      position: absolute;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: top 0.5s, left 0.5s;
      pointer-events: none;
    }
    
    /* Script-Eingabebereich – rechts neben dem Labyrinth */
    #scriptContainer {
      width: 300px;
      height: 457px; /* gleiche Höhe wie Labyrinth */
      text-align: center;
      display: flex;
      flex-direction: column;
    }
    #scriptContainer textarea {
      width: 100%;
      height: 100%;  /* Füllt den gesamten Container */
      background: #222;
      color: #fdfdfd;
      border: 1px solid #0f0;
      border-radius: 5px;
      padding: 10px;
      font-family: monospace;
      resize: none;
      box-sizing: border-box;
    }

    #scriptContainer button {
      background-color: #0f0;
      color: #000;
      padding: 10px 20px;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    #scriptContainer button:hover {
      background-color: #6f6;
    }
    
    /* Fehleranzeige unter dem Button */
    #errorDisplay {
      color: red;
      font-size: 1rem;
      margin-top: 10px;
      min-height: 1.2em;
    }
    
    /* Gemeinsamer Box-Stil (für weitere Dashboard-Elemente) */
    .box {
      background-color: #011d09;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 4px 12px rgba(18, 1, 65, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .box:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <!-- Zurück-Pfeil -->
  <div class="back-arrow" onclick="window.location.href='dashboard.html'">&#8592; back</div>
  
  <div class="dashboard">
    <div class="heading">
      <h1>Server-Verwaltung – Labyrinth Rätsel</h1>
      <p>Die Schildkröte muss alle Münzen sammeln!</p>
      <p>Verwende: <code>turtle.up(3)</code>, <code>turtle.down(2)</code>, <code>turtle.left()</code>, <code>turtle.right()</code> und <code>turtle.collect()</code></p>
    </div>
    
    <!-- Wrapper für Labyrinth und Script-Eingabe -->
    <div class="labyrinth-wrapper">
      <!-- Labyrinth-Container -->
      <div id="labyrinth">
        <div id="cellsContainer"></div>
        <div id="turtleElement">🐢</div>
      </div>
      <!-- Eingabe- und Steuerbereich -->
      <div id="scriptContainer">
        <textarea id="scriptInput" placeholder="Gib hier dein Script ein, z. B.:
turtle.right(2);
turtle.down(3);
turtle.collect();"></textarea>
        <button class="button" onclick="runScript()">Script ausführen</button>
        <div id="errorDisplay"></div>
      </div>
    </div>
    <div id="coinCounter">Gesammelte Münzen: 0</div>
  </div>
  
  <script>
    // Definition des Labyrinths (10x10)
    // Legende: " " = leer, "W" = Wand, "C" = Münze
    const labyrinth = [
      [" ", " ", "W", "W", "W", " ", "C", " ", " ", " "],
      ["W", " ", " ", " ", "W", " ", "W", " ", "W", " "],
      [" ", " ", "W", " ", " ", " ", " ", " ", "W", " "],
      [" ", "W", "W", "W", " ", "W", "W", " ", " ", " "],
      [" ", " ", " ", " ", " ", " ", "W", "W", "W", " "],
      [" ", "W", "W", "W", "W", " ", " ", " ", " ", " "],
      [" ", " ", "C", " ", "W", " ", "W", "W", " ", " "],
      ["W", " ", "W", " ", " ", " ", " ", "W", " ", " "],
      [" ", " ", "W", " ", "W", "W", " ", " ", " ", " "],
      [" ", " ", " ", " ", " ", " ", " ", "W", "C", " "],
    ];
    const rows = labyrinth.length;
    const cols = labyrinth[0].length;
    
    // Zähler für gesammelte Münzen
    let coinCount = 0;
    
    // Globale Promise-Kette für Turtle-Bewegungen
    let movementChain = Promise.resolve();
    
    // Turtle-Objekt mit asynchronen Bewegungsschritten
    const turtle = {
      row: 0,
      col: 0,
      move: function(dr, dc) {
        const newRow = this.row + dr;
        const newCol = this.col + dc;
        if (newRow < 0 || newRow >= rows || newCol < 0 || newCol >= cols) {
          showError("Ungültige Bewegung: außerhalb des Labyrinths!");
          return false;
        }
        if (labyrinth[newRow][newCol] === "W") {
          showError("Bewegung blockiert durch Wand!");
          return false;
        }
        clearError();
        this.row = newRow;
        this.col = newCol;
        updateTurtlePosition();
        return true;
      },
      up: function(steps = 1) {
        for (let i = 0; i < steps; i++) {
          movementChain = movementChain.then(() => new Promise((resolve) => {
            if (!this.move(-1, 0)) {
              resolve();
            } else {
              setTimeout(resolve, 500);
            }
          }));
        }
      },
      down: function(steps = 1) {
        for (let i = 0; i < steps; i++) {
          movementChain = movementChain.then(() => new Promise((resolve) => {
            if (!this.move(1, 0)) {
              resolve();
            } else {
              setTimeout(resolve, 500);
            }
          }));
        }
      },
      left: function(steps = 1) {
        for (let i = 0; i < steps; i++) {
          movementChain = movementChain.then(() => new Promise((resolve) => {
            if (!this.move(0, -1)) {
              resolve();
            } else {
              setTimeout(resolve, 500);
            }
          }));
        }
      },
      right: function(steps = 1) {
        for (let i = 0; i < steps; i++) {
          movementChain = movementChain.then(() => new Promise((resolve) => {
            if (!this.move(0, 1)) {
              resolve();
            } else {
              setTimeout(resolve, 500);
            }
          }));
        }
      },
      collect: function() {
        movementChain = movementChain.then(() => new Promise((resolve) => {
          if (labyrinth[this.row][this.col] === "C") {
            labyrinth[this.row][this.col] = " ";
            coinCount++;
            document.getElementById("coinCounter").textContent = "Gesammelte Münzen: " + coinCount;
            renderCells();
            clearError();
            updateTurtlePosition();
            if (coinCount === 3) {
              // Alle Münzen gesammelt: Flag setzen, Erfolgsmeldung anzeigen und nach 3 Sekunden zum Dashboard weiterleiten.
              localStorage.setItem("labyrinthCompleted", "true");
              document.body.innerHTML = `
                <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #0f0; font-size: 2rem;">
                  <p>Success! Alle Münzen gesammelt!</p>
                  <p>Weiterleitung zum Dashboard...</p>
                </div>
              `;
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 3000);
            }
          } else {
            showError("Keine Münze hier!");
          }
          setTimeout(resolve, 500);
        }));
      }
    };
    
    // Funktionen zur Fehleranzeige
    function showError(msg) {
      document.getElementById("errorDisplay").textContent = msg;
    }
    function clearError() {
      document.getElementById("errorDisplay").textContent = "";
    }
    
    // Funktion zum Rendern der Labyrinth-Zellen (ohne Turtle)
    function renderCells() {
      const container = document.getElementById("cellsContainer");
      container.innerHTML = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cellDiv = document.createElement("div");
          cellDiv.classList.add("cell");
          if (labyrinth[r][c] === "W") {
            cellDiv.classList.add("wall");
          } else if (labyrinth[r][c] === "C") {
            cellDiv.classList.add("coin");
            cellDiv.textContent = "🪙";
          } else {
            cellDiv.classList.add("empty");
          }
          container.appendChild(cellDiv);
        }
      }
    }
    
    // Funktion zum Aktualisieren der Turtle-Position (zentriert in der Zelle)
    function updateTurtlePosition() {
      const cellSize = 40;
      const gap = 2;
      const padding = 5;
      const left = padding + turtle.col * (cellSize + gap);
      const top = padding + turtle.row * (cellSize + gap);
      const turtleEl = document.getElementById("turtleElement");
      turtleEl.style.left = left + "px";
      turtleEl.style.top = top + "px";
    }
    
    // Funktion, um das Script schrittweise auszuführen (mit Animation)
    function runScript() {
      clearError();
      movementChain = Promise.resolve();
      const code = document.getElementById("scriptInput").value;
      let commands = code.split(";").map(cmd => cmd.trim()).filter(cmd => cmd.length > 0);
      executeCommands(commands, 0);
    }
    
    function executeCommands(commands, index) {
      if (index >= commands.length) return;
      try {
        eval(commands[index] + ";");
        clearError();
      } catch (e) {
        showError("Fehler im Script: " + e.message);
        return;
      }
      movementChain.then(() => {
        setTimeout(() => {
          executeCommands(commands, index + 1);
        }, 500);
      });
    }
    
    // Funktion zum Zurücksetzen des Labyrinths
    function resetLabyrinth() {
      localStorage.removeItem("labyrinthCompleted");
      window.location.reload();
    }
    
    // Beim Laden prüfen, ob das Labyrinth bereits abgeschlossen wurde
    window.addEventListener("load", () => {
      if (localStorage.getItem("labyrinthCompleted") === "true") {
        document.body.innerHTML = `
          <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #0f0; font-size: 2rem;">
            <p>Labyrinth bereits abgeschlossen!</p>
            <button onclick="resetLabyrinth()">Neu starten</button>
          </div>
        `;
      } else {
        // Initiales Rendering, falls noch nicht abgeschlossen
        renderCells();
        updateTurtlePosition();
      }
    });
  </script>
</body>
</html>
