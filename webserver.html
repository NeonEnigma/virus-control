<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Server-Verwaltung – Labyrinth Rätsel</title>
  <style>/* CSS unverändert */ html,body{margin:0;padding:0;width:100%;height:100%;background-color:#000}body{font-family:monospace;color:#fdfdfd;display:flex;flex-direction:column}.back-arrow{text-decoration:none;position:absolute;top:20px;left:20px;font-size:15px;color:#0f0;cursor:pointer;padding:10px;z-index:100;background-color:rgba(0,0,0,.5);border-radius:5px}.back-arrow:hover{background-color:rgba(0,255,0,.2)}.dashboard{flex:1;display:flex;flex-direction:column;padding:20px;box-sizing:border-box;position:relative}.heading{text-align:center;margin-bottom:20px}.heading h1{font-size:2rem;margin-bottom:10px;margin-top:50px}.heading p{margin:5px 0}#coinCounter{font-size:1.2rem;color:#ffd700;margin-top:70px;text-align:center}.labyrinth-wrapper{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:70px}#labyrinth{position:relative;width:fit-content;height:428px;background-color:#333;border:1px solid #0f0;border-radius:10px;padding:5px;box-sizing:border-box}#cellsContainer{display:grid;grid-template-columns:repeat(10,40px);grid-template-rows:repeat(10,40px);gap:2px}.cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:1rem}.wall{background:#555}.empty{background:#222}.coin{background-color:#222;box-shadow:0 2px 5px rgba(0,0,0,.5);color:#000;font-size:1.2rem;display:flex;align-items:center;justify-content:center}#turtleElement{position:absolute;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:top .5s,left .5s;pointer-events:none}#scriptContainer{width:300px;height:457px;text-align:center;display:flex;flex-direction:column}#scriptContainer textarea{width:100%;height:100%;background:#222;color:#fdfdfd;border:1px solid #0f0;border-radius:5px;padding:10px;font-family:monospace;resize:none;box-sizing:border-box}#scriptContainer button{background-color:#0f0;color:#000;padding:10px 20px;border:none;border-radius:7px;font-size:1rem;cursor:pointer;transition:background-color .2s;margin-top:10px}#scriptContainer button:hover{background-color:#6f6}#errorDisplay{color:red;font-size:1rem;margin-top:10px;min-height:1.2em}.box{background-color:#011d09;border-radius:20px;padding:20px;box-sizing:border-box;text-align:center;box-shadow:0 4px 12px rgba(18,1,65,.3);transition:transform .2s,box-shadow .2s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.box:hover{transform:translateY(-3px);box-shadow:0 8px 16px rgba(0,0,0,.5)}.success-container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background-color:#000;text-align:center}.success-icon{font-size:5rem;color:#0f0;margin-bottom:20px;animation:pulse 2s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}.success-title{color:#0f0;font-size:2.5rem;margin-bottom:15px}.success-message{color:#afa;font-size:1.5rem;margin-bottom:30px}.success-detail{color:#8f8;font-size:1.2rem;margin-bottom:40px;max-width:600px}.dashboard-btn{background-color:#0f0;color:#000;border:none;padding:12px 25px;border-radius:5px;font-size:1.2rem;cursor:pointer;text-decoration:none;transition:all .3s ease}.dashboard-btn:hover{background-color:#6f6;transform:scale(1.05);box-shadow:0 0 15px rgba(0,255,0,.5)}</style>
</head>
<body>
  
  <script type="module">
    import { api } from './js/api.js';

    // Simple Gatekeeper
    (async function init() {
      try {
        const user = await api.request('/users/me');
        const puzzles = user.puzzles || {};
        
        if (user.isAdmin === true || puzzles.terminalCompleted === true) {
             if (puzzles.labyrinthCompleted === true) {
                 showSuccessPage();
             } else {
                 showGamePage();
                 initializeLabyrinth(user);
             }
        } else {
             alert("Zugriff verweigert! Du musst zuerst das Terminal-Rätsel lösen.");
             window.location.href = 'terminal.html';
        }
      } catch (e) {
        console.error("Auth error", e);
        document.body.innerHTML = `<h2 style="color:red; text-align:center;">Auth Error (Webserver)</h2><p style="text-align:center;">${e.message}</p><div style="text-align:center;"><button onclick="window.location.href='index.html'">Login</button></div>`;
        // window.location.href = 'index.html'; // REMOVED
      }
    })();

    // ==========================================================
    // KORRIGIERTE LABYRINTH-LOGIK
    // ==========================================================
    function initializeLabyrinth(user) {
      const labyrinth = [
        [" ", " ", "W", "W", "W", " ", "C", " ", " ", " "],["W", " ", " ", " ", "W", " ", "W", " ", "W", " "],[" ", " ", "W", " ", " ", " ", " ", " ", "W", " "],[" ", "W", "W", "W", " ", "W", "W", " ", " ", " "],[" ", " ", " ", " ", " ", " ", "W", "W", "W", " "],[" ", "W", "W", "W", "W", " ", " ", " ", " ", " "],[" ", " ", "C", " ", "W", " ", "W", "W", " ", " "],["W", " ", "W", " ", " ", " ", " ", "W", " ", " "],[" ", " ", "W", " ", "W", "W", " ", " ", " ", " "],[" ", " ", " ", " ", " ", " ", " ", "W", "C", " "],
      ];
      // HIER WAR DER FEHLER: Diese Variablen waren im minifizierten Code falsch.
      const rows = labyrinth.length;
      const cols = labyrinth[0].length;
      let coinCount = 0;
      let movementChain = Promise.resolve();

      const turtle = {
        row: 0, col: 0,
        move: function(dr, dc) { const newRow = this.row + dr; const newCol = this.col + dc; if (newRow < 0 || newRow >= rows || newCol < 0 || newCol >= cols) { showError("Ungültige Bewegung: außerhalb des Labyrinths!"); return false; } if (labyrinth[newRow][newCol] === "W") { showError("Bewegung blockiert durch Wand!"); return false; } clearError(); this.row = newRow; this.col = newCol; updateTurtlePosition(); return true; },
        up: function(steps = 1) { for (let i = 0; i < steps; i++) { movementChain = movementChain.then(() => new Promise((resolve) => { if (!this.move(-1, 0)) { resolve(); } else { setTimeout(resolve, 500); } })); } },
        down: function(steps = 1) { for (let i = 0; i < steps; i++) { movementChain = movementChain.then(() => new Promise((resolve) => { if (!this.move(1, 0)) { resolve(); } else { setTimeout(resolve, 500); } })); } },
        left: function(steps = 1) { for (let i = 0; i < steps; i++) { movementChain = movementChain.then(() => new Promise((resolve) => { if (!this.move(0, -1)) { resolve(); } else { setTimeout(resolve, 500); } })); } },
        right: function(steps = 1) { for (let i = 0; i < steps; i++) { movementChain = movementChain.then(() => new Promise((resolve) => { if (!this.move(0, 1)) { resolve(); } else { setTimeout(resolve, 500); } })); } },
        collect: function() {
          movementChain = movementChain.then(() => new Promise((resolve) => {
            if (labyrinth[this.row][this.col] === "C") {
              labyrinth[this.row][this.col] = " ";
              coinCount++;
              document.getElementById("coinCounter").textContent = "Gesammelte Münzen: " + coinCount;
              renderCells();
              clearError();
              updateTurtlePosition();
              if (coinCount === 3) {
              if (coinCount === 3) {
                // Save progress
                api.request('/game/puzzles', 'PUT', { labyrinthCompleted: true })
                .then(() => {
                   console.log("Webserver-Rätsel-Status gespeichert!");
                   window.location.href = "success.html";
                })
                .catch(err => showError("Fehler beim Speichern: " + err));
              }
              }
            } else { showError("Keine Münze hier!"); }
            setTimeout(resolve, 500);
          }));
        }
      };

      function showError(msg) { document.getElementById("errorDisplay").textContent = msg; }
      function clearError() { document.getElementById("errorDisplay").textContent = ""; }
      function renderCells() { const container = document.getElementById("cellsContainer"); container.innerHTML = ""; for (let r = 0; r < rows; r++) { for (let c = 0; c < cols; c++) { const cellDiv = document.createElement("div"); cellDiv.classList.add("cell"); if (labyrinth[r][c] === "W") { cellDiv.classList.add("wall"); } else if (labyrinth[r][c] === "C") { cellDiv.classList.add("coin"); cellDiv.textContent = "🪙"; } else { cellDiv.classList.add("empty"); } container.appendChild(cellDiv); } } }
      function updateTurtlePosition() { const cellSize = 40; const gap = 2; const padding = 5; const left = padding + turtle.col * (cellSize + gap); const top = padding + turtle.row * (cellSize + gap); const turtleEl = document.getElementById("turtleElement"); turtleEl.style.left = left + "px"; turtleEl.style.top = top + "px"; }
      
      function runScript() {
        clearError();
        movementChain = Promise.resolve();
        const code = document.getElementById("scriptInput").value;
        try {
          const commands = new Function('turtle', code);
          commands(turtle);
        } catch (e) {
          showError("Fehler im Script: " + e.message);
        }
      }
      
      document.getElementById('runScriptBtn').addEventListener('click', runScript);
      
      renderCells();
      updateTurtlePosition();
    }
  </script>
</body>
</html>
