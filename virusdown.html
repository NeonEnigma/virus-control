<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Virus deaktiviert - Erfolg!</title>
  <style>
    /* Ihr CSS bleibt unverändert */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    body { font-family: monospace; color: #fdfdfd; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .success-container { width: 90%; max-width: 800px; padding: 50px 30px; background-color: rgba(0, 20, 0, 0.8); border-radius: 20px; box-shadow: 0 0 50px rgba(0, 255, 0, 0.8); border: 2px solid rgb(0, 200, 0); text-align: center; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.8); } 50% { box-shadow: 0 0 70px rgba(0, 255, 0, 1); } 100% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.8); } }
    h1 { font-size: 3.5rem; margin: 0 0 20px 0; color: rgb(0, 255, 0); text-transform: uppercase; letter-spacing: 3px; }
    h2 { font-size: 1.8rem; margin: 0 0 40px 0; color: rgb(200, 255, 200); font-weight: normal; }
    .status-container { margin: 30px 0; padding: 20px; background-color: rgba(0, 40, 0, 0.6); border-radius: 10px; text-align: left; }
    .status-line { margin: 15px 0; display: flex; align-items: center; }
    .status-icon { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background-color: rgb(0, 255, 0); margin-right: 15px; }
    .status-text { font-size: 1.2rem; color: rgb(200, 255, 200); }
    .terminal { width: 80%; height: 120px; background-color: black; border: 1px solid rgb(0, 200, 0); border-radius: 5px; padding: 15px; margin: 30px auto; text-align: left; font-family: monospace; overflow: hidden; }
    .terminal-text { color: rgb(0, 255, 0); white-space: pre-wrap; overflow: hidden; margin: 0; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { display: inline-block; width: 10px; height: 18px; background-color: rgb(0, 255, 0); animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }
    .fireworks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
    .firework { position: absolute; width: 6px; height: 6px; border-radius: 50%; background-color: rgb(0, 255, 0); opacity: 0; z-index: -1; }
    .btn { background-color: rgb(0, 150, 0); color: white; border: none; padding: 15px 30px; margin-top: 30px; font-size: 1.2rem; font-family: monospace; border-radius: 5px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
    .btn:hover { background-color: rgb(0, 200, 0); transform: scale(1.05); }
  </style>
</head>
<body>

  <div id="page-content" style="display: none;">
    <div class="fireworks" id="fireworks"></div>
    <div class="success-container">
      <h1>Mission erfolgreich</h1>
      <h2>SAP-Virus neutralisiert</h2>
      <div class="terminal">
        <p class="terminal-text" id="terminal-text"></p>
        <span class="cursor"></span>
      </div>
      <div class="status-container">
        <div class="status-line"><span class="status-icon"></span><span class="status-text">Viruscode deaktiviert</span></div>
        <div class="status-line"><span class="status-icon"></span><span class="status-text">Infizierte Server bereinigt</span></div>
        <div class="status-line"><span class="status-icon"></span><span class="status-text">Sicherheitsfirewalls wiederhergestellt</span></div>
        <div class="status-line"><span class="status-icon"></span><span class="status-text">Systeme gesichert</span></div>
      </div>
    </div>
  </div>
  
  <script type="module">
    // Firebase initialisieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // "Türsteher"-Skript
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Prüfe, ob das Main-Server-Rätsel gelöst wurde
        const userRef = ref(db, 'users/' + user.uid);
        get(userRef).then((snapshot) => {
          if (snapshot.exists()) {
            const userData = snapshot.val();
            const puzzles = userData.puzzles || {};
            
            // ZUGANGSKONTROLLE
            if (userData.isAdmin === true || puzzles.mainServerCompleted === true) {
              console.log("Zugriff auf Erfolgsseite gewährt.");
              document.getElementById('page-content').style.display = 'block';
              initializeSuccessAnimation();
            } else {
              console.log("Zugriff verweigert, Main-Server-Rätsel nicht gelöst.");
              alert("Zugriff verweigert!");
              window.location.href = 'dashboard397297297924.html';
            }
          } else {
            window.location.href = 'index.html';
          }
        });
      } else {
        window.location.href = 'index.html';
      }
    });

    // Die Logik für die Animationen, die nur nach erfolgreicher Prüfung ausgeführt wird
    function initializeSuccessAnimation() {
      // Terminal-Text-Animation
      const terminalElement = document.getElementById('terminal-text');
      const text = `> VIRUS_DEACTIVATION_SEQUENCE_INITIATED\n> IDENTIFYING_VIRUS_SIGNATURES...COMPLETE\n> NEUTRALIZING_MALICIOUS_CODE...COMPLETE\n> RESTORING_SECURITY_PROTOCOLS...COMPLETE\n> SYSTEM_SECURE: All threats eliminated. Great job, hacker!`;
      let i = 0;
      const typeText = () => { if (i < text.length) { terminalElement.textContent += text.charAt(i++); setTimeout(typeText, Math.random() * 30 + 20); } };
      setTimeout(typeText, 500);

      // Feuerwerksanimation
      const fireworksContainer = document.getElementById('fireworks');
      const colors = ['#00ff00', '#88ff88', '#00aa00', '#aaffaa', '#ffffff'];
      function createFirework() {
        if (document.hidden) return;
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight * 0.5;
        for (let i = 0; i < 30; i++) {
          const particle = document.createElement('div');
          particle.classList.add('firework');
          particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          particle.style.left = `${x}px`;
          particle.style.top = `${y}px`;
          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 100 + 50;
          particle.animate([ { transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`, opacity: 0 } ], { duration: 1000 + Math.random() * 1000, easing: 'cubic-bezier(0, .9, .57, 1)', delay: Math.random() * 200 });
          fireworksContainer.appendChild(particle);
          setTimeout(() => { particle.remove(); }, 2000);
        }
        setTimeout(createFirework, Math.random() * 1000 + 300);
      }
      for (let i = 0; i < 5; i++) { setTimeout(createFirework, i * 300); }
    }
  </script>
</body>
</html>
