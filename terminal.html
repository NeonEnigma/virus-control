<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Terminal</title>
  <style>
    /* Ihr komplettes CSS bleibt hier unverändert. */
    body { background-color: #000; color: #0f0; font-family: monospace; margin: 0; padding: 0; }
    .timer-area { position: absolute; top: 10px; right: 10px; color: #0f0; font-family: monospace; text-align: right; font-size: 20px; }
    #terminal { width: 80%; height: 80vh; margin: 40px auto; padding: 10px; border: 2px solid #0f0; overflow-y: auto; white-space: pre-wrap; position: relative; }
    .prompt-line { display: flex; align-items: center; flex-wrap: wrap; }
    .prompt { margin-right: 5px; }
    .input { flex: 1; }
    input[type="text"], input[type="password"] { background: transparent; border: none; outline: none; color: #0f0; width: 100%; font-family: monospace; }
    input[type="text"]::selection, input[type="password"]::selection { background: #444; color: #0f0; }
    .file-item { color: #0f0; display: inline-block; width: 33%; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-list { display: flex; flex-wrap: wrap; width: 100%; }
    @media (max-width: 600px) { .file-item { width: 100%; } }
  </style>
