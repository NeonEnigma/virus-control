    input[type="text"]::selection, input[type="password"]::selection { background: #444; color: #0f0; }

    let timerInterval = null;

    function initializeTimer(user) {
      const displayEl = document.getElementById("globalTimer");
      
      const checkTimer = async () => {
         try {
           const userData = await api.request('/users/me');
           // Sync local user data
           currentUser = userData; 
           
           if (userData.timerStatus === 'active' && userData.timerEndTime) {
              const endTime = new Date(userData.timerEndTime).getTime();
              const updateDisplay = () => {
                  const now = Date.now();
                  const diffMs = endTime - now;
                  if (diffMs <= 0) {
                      displayEl.textContent = "00:00:00";
                      // Handle Lose
                      // We should ideally call an API to register 'lose', but simplistically:
                      window.location.href = "fail.html"; 
                  } else {
                      const diffSec = Math.floor(diffMs / 1000);
                      const hh = Math.floor(diffSec / 3600);
                      const mm = Math.floor((diffSec % 3600) / 60);
                      const ss = diffSec % 60;
                      displayEl.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
                  }
              };
              updateDisplay();
              // Create a local high-freq interval for display if not exists
              if (!timerInterval) timerInterval = setInterval(updateDisplay, 1000);
           } else if (userData.timerStatus === 'paused') {
              clearInterval(timerInterval); timerInterval = null;
              const remaining = Math.max(0, Math.floor(userData.timerPausedRemaining || 0));
              displayEl.textContent = "Pause: " + formatRemaining(remaining);
           } else {
              clearInterval(timerInterval); timerInterval = null;
              displayEl.textContent = "Kein Timer";
           }
         } catch(e) { console.error(e); }
      };

      checkTimer();
      pollInterval = setInterval(checkTimer, 5000); // Sync every 5s
    }

    function formatRemaining(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));
      const hh = Math.floor(seconds / 3600);
      const mm = Math.floor((seconds % 3600) / 60);
      const ss = seconds % 60;
      const mmss = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
      return hh > 0 ? `${String(hh).padStart(2, '0')}:${mmss}` : mmss;
    }

PRIVATE KEY-----"}, {name: "id_rsa.pub", type: "file", content: "ssh-rsa AAAA..."} ] } ] } ] }, { name: "usr", type: "directory", children: [ { name: "local", type: "directory", children: [ { name: "bin", type: "directory", children: [] } ] }, { name: "share", type: "directory", children: [ { name: "doc", type: "directory", children: [] } ] } ] }, { name: "var", type: "directory", children: [ { name: "log", type: "directory", children: [{ name: "syslog", type: "file", content: "System logs..." }] }, { name: "www", type: "directory", children: [] } ] }, { name: "tmp", type: "directory", children: [] }, { name: "lib", type: "directory", children: [ {name: "libc.so.6", type: "file", content: "Shared library"}, {name: "libssl.so.1.1", type: "file", content: "Shared library"} ] }, { name: "dev", type: "directory", children: [ {name: "sda1", type: "file", content: "Device file"}, {name: "null", type: "file", content: "Device file"} ] }, { name: "proc", type: "directory", children: [ {name: "cpuinfo", type: "file", content: "Processor information"} ] }, { name: "root", type: "directory", children: [ {name: ".bash_history", type: "file", content: "Bash-Verlauf des Root-Benutzers"} ] } ] };

      function initTerminal() { printLine("Willkommen in deinem digitalen Tresor, John.\nGib 'help' für eine Befehlsübersicht ein.\n"); newPrompt("command"); }
      function newPrompt(mode = "command") { terminalMode = mode; const p = document.createElement("div"); p.className = "prompt-line"; const s = document.createElement("span"); s.className = "prompt"; if (mode === "sshPassword" || mode === "filePassword") { s.textContent = "password:"; } else { s.textContent = `user@web:${getCurrentPathString()}$`; } const iC = document.createElement("div"); iC.className = "input"; const iF = document.createElement("input"); iF.type = (mode === "sshPassword" || mode === "filePassword") ? "password" : "text"; iF.addEventListener("keydown", (e) => { if (e.key === "Enter") { const uI = iF.value.trim(); iC.remove(); const cS = document.createElement("span"); cS.textContent = (mode === "command") ? " " + uI : " ********"; p.appendChild(cS); handleInput(uI, mode); } }); iC.appendChild(iF); p.appendChild(s); p.appendChild(iC); terminal.appendChild(p); iF.focus(); terminal.scrollTop = terminal.scrollHeight; }
      function handleInput(userInput, mode) { if (mode === "sshPassword") { checkSSHPassword(userInput); } else if (mode === "filePassword") { checkFilePassword(userInput); } else { executeCommand(userInput); } }

      function cdCommand(path) { if (!path) return; if (path === "/") { currentPath = [fileSystem]; return; } if (path === "..") { if (currentPath.length > 1) currentPath.pop(); return; } if (path.startsWith("./")) path = path.substring(2); const tD = findChildDirectory(path); if (tD) { currentPath.push(tD); } else { printLine(`Verzeichnis nicht gefunden: ${path}`); } }
      function catCommand(fileName) { if (!fileName) return false; const d = currentPath[currentPath.length - 1]; const fO = d.children?.find(c => c.name === fileName && c.type === "file"); if (!fO) { printLine(`Datei nicht gefunden: ${fileName}`); return false; } if (fO.name === "secret.txt") { pendingFileContent = fO.content; newPrompt("filePassword"); return true; } else { printLine(fO.content || "Leere Datei."); return false; } }
