<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Terminal</title>
  <style>
    /* Ihr komplettes CSS bleibt hier unverändert. */
    body { background-color: #000; color: #0f0; font-family: monospace; margin: 0; padding: 0; }
    .timer-area { position: absolute; top: 10px; right: 10px; color: #0f0; font-family: monospace; text-align: right; font-size: 20px; }
    #terminal { width: 80%; height: 80vh; margin: 40px auto; padding: 10px; border: 2px solid #0f0; overflow-y: auto; white-space: pre-wrap; position: relative; }
    .prompt-line { display: flex; align-items: center; flex-wrap: wrap; }
    .prompt { margin-right: 5px; }
    .input { flex: 1; }
    input[type="text"], input[type="password"] { background: transparent; border: none; outline: none; color: #0f0; width: 100%; font-family: monospace; }
    input[type="text"]::selection, input[type="password"]::selection { background: #444; color: #0f0; }
    .file-item { color: #0f0; display: inline-block; width: 33%; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-list { display: flex; flex-wrap: wrap; width: 100%; }
    @media (max-width: 600px) { .file-item { width: 100%; } }
  </style>
</head>
<body>

  <div class="timer-area" id="globalTimer">Initialisiere...</div>
  <div id="terminal"></div>

  <script type="module">
    // Firebase initialisieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    // NEU: 'update' wird zum Speichern benötigt
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4L9_yyWFxzeRy6eEuSGgsspIRp6rrX3Q",
      authDomain: "escape-star.firebaseapp.com",
      projectId: "escape-star",
      storageBucket: "escape-star.firebasestorage.app",
      messagingSenderId: "764344736028",
      appId: "1:764344736028:web:9111f0a62220f15d7c42d9",
      databaseURL: "https://escape-star-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    
    let timerInterval = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        initializeTimer(user);
        // Die gesamte Terminal-Logik wird jetzt erst initialisiert,
        // damit sie Zugriff auf das 'user'-Objekt hat.
        initializeTerminal(user); 
      } else {
        window.location.href = 'index.html';
      }
    });
    
    function initializeTimer(authUser) {
      const uid = authUser.uid;
      const playerName = authUser.displayName || authUser.email || uid;
      const userTimerRef = ref(db, 'users/' + uid + '/timer');
      const displayEl = document.getElementById("globalTimer");
      onValue(userTimerRef, (snapshot) => {
        const timerData = snapshot.val();
        clearInterval(timerInterval);
        if (timerData && timerData.endTime) {
          const endTime = timerData.endTime;
          const updateTimerDisplay = () => {
            const now = Date.now();
            const diffMs = endTime - now;
            if (diffMs <= 0) {
              displayEl.textContent = "00:00:00";
              clearInterval(timerInterval);
              const puzzleRef = ref(db, 'users/' + uid + '/puzzles/virusDeactivated');
              const lastGameRef = ref(db, 'users/' + uid + '/lastGame');
              const totalSeconds = (timerData && typeof timerData.initialDuration === "number") ? Math.floor(timerData.initialDuration) : null;
              const remainingSecondsAtEnd = Math.max(0, Math.floor(((timerData?.endTime ?? now) - now) / 1000));
              let hasWon = false;
              get(puzzleRef).then((snapshot) => {
                hasWon = snapshot.exists() && snapshot.val() === true;
                if (!hasWon) {
                  return update(lastGameRef, {
                    finishedAt: now,
                    result: "lose",
                    remainingSeconds: remainingSecondsAtEnd,
                    totalSeconds: totalSeconds ?? null,
                    playerName,
                    playerUid: uid
                  });
                }
                return null;
              }).catch((error) => {
                console.error("Fehler beim Prüfen des Spielstatus:", error);
              }).finally(async () => {
                if (!hasWon) {
                  try {
                    const timerUpdate = {
                      pausedRemainingSeconds: 0,
                      endTime: null,
                      status: "lose-paused"
                    };
                    const initialForTimer = Number.isFinite(totalSeconds)
                      ? totalSeconds
                      : (Number.isFinite(timerData?.initialDuration) ? Math.floor(timerData.initialDuration) : null);
                    if (Number.isFinite(initialForTimer)) {
                      timerUpdate.initialDuration = initialForTimer;
                    }
                    await update(ref(db, 'users/' + uid + '/timer'), timerUpdate);
                  } catch (e) {
                    console.error("Timer konnte nicht als verloren markiert werden:", e);
                  }
                }
                if (hasWon) {
                  window.location.href = "virusdown.html";
                } else {
                  window.location.href = "fail.html";
                }
              });
              return;
            }
            const diffSec = Math.floor(diffMs / 1000);
            const hh = Math.floor(diffSec / 3600);
            const mm = Math.floor((diffSec % 3600) / 60);
            const ss = diffSec % 60;
            displayEl.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
          };
          updateTimerDisplay();
          timerInterval = setInterval(updateTimerDisplay, 1000);
        } else if (timerData && Number.isFinite(timerData.pausedRemainingSeconds)) {
          const remaining = Math.max(0, Math.floor(timerData.pausedRemainingSeconds));
          displayEl.textContent = formatRemaining(remaining);
        } else {
          displayEl.textContent = "Kein Timer";
        }
      });
    }

    function formatRemaining(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));
      const hh = Math.floor(seconds / 3600);
      const mm = Math.floor((seconds % 3600) / 60);
      const ss = seconds % 60;
      const mmss = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
      return hh > 0 ? `${String(hh).padStart(2, '0')}:${mmss}` : mmss;
    }

    // Die gesamte Terminal-Logik wird jetzt in eine Funktion gepackt
    function initializeTerminal(user) {
      const fileSystem = { /* ... Ihr unverändertes Dateisystem ... */ name: "/", type: "directory", children: [ { name: "bin", type: "directory", children: [ { name: "bash", type: "executable", content: "ELF binary executable" }, { name: "ls", type: "executable", content: "ELF binary executable" }, { name: "cat", type: "executable", content: "ELF binary executable" } ] }, { name: "boot", type: "directory", children: [ { name: "grub", type: "directory", children: [] }, { name: "vmlinuz", type: "file", content: "Linux kernel" } ] }, { name: "etc", type: "directory", children: [ { name: "shadow", type: "file", content: "root:*:18752:0:99999:7:::\nuser:$6$saltsalt$encrypted" }, { name: "hostname", type: "file", content: "my-linux-pc" }, ] }, { name: "home", type: "directory", children: [ { name: "john", type: "directory", children: [ { name: "documents", type: "directory", children: [ { name: "secret.txt", type: "file", content: "Terminal-Befehl geheime Virtual Machine:\nssh -p 2432 john@secretserver\nPwd: d4Gfdee" }, { name: ".private-notes.txt", type: "file", content: "Mein Passwort: 32529" } ] }, { name: "images", type: "directory", children: [ {name: "johanna.jpg", type: "file", content: "Bilddatei" }, {name: "mallorca.jpg", type: "file", content: "Bilddatei" }, {name: "mama&papa.jpg", type: "file", content: "Bilddatei" }, {name: "dresdensommer.jpg", type: "file", content: "Bilddatei" }, {name: "cookie.jpg", type: "file", content: "Bilddatei" }, {name: "dresdennacht.jpg", type: "file", content: "Bilddatei" }, {name: ".versteckt.jpg", type: "file", content: "Verstecktes Bild mit wichtigen Daten" } ] }, { name: "downloads", type: "directory", children: [ {name: "explore@VT_installer.dmg", type: "executable", content: "Installationsdatei"} ] }, { name: ".bashrc", type: "file", content: "export PATH=$PATH:/usr/local/bin" }, { name: ".ssh", type: "directory", children: [ {name: "id_rsa", type: "file", content: "-----BEGIN PRIVATE KEY-----\nVersteckter SSH-Key\n-----END PRIVATE KEY-----"}, {name: "id_rsa.pub", type: "file", content: "ssh-rsa AAAA..."} ] } ] } ] }, { name: "usr", type: "directory", children: [ { name: "local", type: "directory", children: [ { name: "bin", type: "directory", children: [] } ] }, { name: "share", type: "directory", children: [ { name: "doc", type: "directory", children: [] } ] } ] }, { name: "var", type: "directory", children: [ { name: "log", type: "directory", children: [{ name: "syslog", type: "file", content: "System logs..." }] }, { name: "www", type: "directory", children: [] } ] }, { name: "tmp", type: "directory", children: [] }, { name: "lib", type: "directory", children: [ {name: "libc.so.6", type: "file", content: "Shared library"}, {name: "libssl.so.1.1", type: "file", content: "Shared library"} ] }, { name: "dev", type: "directory", children: [ {name: "sda1", type: "file", content: "Device file"}, {name: "null", type: "file", content: "Device file"} ] }, { name: "proc", type: "directory", children: [ {name: "cpuinfo", type: "file", content: "Processor information"} ] }, { name: "root", type: "directory", children: [ {name: ".bash_history", type: "file", content: "Bash-Verlauf des Root-Benutzers"} ] } ] };
      let terminalMode = "command";
      let pendingFileContent = null;
      let currentPath = [fileSystem];
      const terminal = document.getElementById("terminal");
      initTerminal();
      function initTerminal() { printLine("Willkommen in deinem digitalen Tresor, John.\nGib 'help' für eine Befehlsübersicht ein.\n"); newPrompt("command"); }
      function newPrompt(mode = "command") { terminalMode = mode; const p = document.createElement("div"); p.className = "prompt-line"; const s = document.createElement("span"); s.className = "prompt"; if (mode === "sshPassword" || mode === "filePassword") { s.textContent = "password:"; } else { s.textContent = `user@web:${getCurrentPathString()}$`; } const iC = document.createElement("div"); iC.className = "input"; const iF = document.createElement("input"); iF.type = (mode === "sshPassword" || mode === "filePassword") ? "password" : "text"; iF.addEventListener("keydown", (e) => { if (e.key === "Enter") { const uI = iF.value.trim(); iC.remove(); const cS = document.createElement("span"); cS.textContent = (mode === "command") ? " " + uI : " ********"; p.appendChild(cS); handleInput(uI, mode); } }); iC.appendChild(iF); p.appendChild(s); p.appendChild(iC); terminal.appendChild(p); iF.focus(); terminal.scrollTop = terminal.scrollHeight; }
      function handleInput(userInput, mode) { if (mode === "sshPassword") { checkSSHPassword(userInput); } else if (mode === "filePassword") { checkFilePassword(userInput); } else { executeCommand(userInput); } }
      
      function checkSSHPassword(password) {
        if (password === "d4Gfdee") {
          printLine("Zugriff gewährt. Speichere Fortschritt und leite zum Dashboard weiter ...");
          
          // ==========================================================
          // HIER IST DIE ANPASSUNG: Speichere den Erfolg in Firebase
          const userPuzzlesRef = ref(db, 'users/' + user.uid + '/puzzles');
          update(userPuzzlesRef, {
            terminalCompleted: true
          }).then(() => {
            console.log("Terminal-Rätsel Status in Firebase gespeichert!");
            setTimeout(() => {
              // HIER MUSS DER KORREKTE DATEINAME FÜR DAS DASHBOARD STEHEN
              window.location.href = "dashboard.html";
            }, 1000);
          });
          // ==========================================================

        } else {
          printLine("Falsches Passwort!");
          newPrompt("command");
        }
      }

      function checkFilePassword(password) { if (password === "32529") { if (pendingFileContent) { printLine(pendingFileContent); } newPrompt("command"); } else { printLine("Falsches Datei-Passwort!"); newPrompt("command"); } pendingFileContent = null; }
      function executeCommand(command) { const a = command.split(" ").filter(Boolean); const c = a[0] ? a[0].toLowerCase() : ""; if (command.toLowerCase() === "ssh -p 2432 john@secretserver") { newPrompt("sshPassword"); return; } switch (c) { case "help": printLine("Verfügbare Befehle:\n  ls, ls -a\n  cd <pfad>\n  cat <datei>\n  pwd\n  clear\n  help"); break; case "ls": lsCommand(a.includes("-a")); break; case "cd": cdCommand(a[1]); break; case "cat": if (!catCommand(a[1])) newPrompt("command"); return; case "pwd": printLine(getCurrentPathString()); break; case "clear": clearTerminal(); break; case "": break; default: printLine(`Unbekanntes Kommando: ${c}.`); } newPrompt("command"); }
      function lsCommand(showHidden = false) { const d = currentPath[currentPath.length - 1]; if (d.type === "directory") { if (!d.children || d.children.length === 0) { printLine("Leeres Verzeichnis."); } else { let fC = showHidden ? d.children : d.children.filter(c => !c.name.startsWith('.')); if (fC.length === 0) { printLine("Keine sichtbaren Inhalte."); return; } const sC = fC.sort((a,b) => (a.type === "directory" && b.type !== "directory") ? -1 : (a.type !== "directory" && b.type === "directory") ? 1 : a.name.localeCompare(b.name)); const fLC = document.createElement("div"); fLC.className = "file-list"; sC.forEach(c => { const fI = document.createElement("div"); fI.className = "file-item"; fI.textContent = c.name; fLC.appendChild(fI); }); terminal.appendChild(fLC); } } else { printLine("Kein Verzeichnis."); } }
      function cdCommand(path) { if (!path) return; if (path === "/") { currentPath = [fileSystem]; return; } if (path === "..") { if (currentPath.length > 1) currentPath.pop(); return; } if (path.startsWith("./")) path = path.substring(2); const tD = findChildDirectory(path); if (tD) { currentPath.push(tD); } else { printLine(`Verzeichnis nicht gefunden: ${path}`); } }
      function catCommand(fileName) { if (!fileName) return false; const d = currentPath[currentPath.length - 1]; const fO = d.children?.find(c => c.name === fileName && c.type === "file"); if (!fO) { printLine(`Datei nicht gefunden: ${fileName}`); return false; } if (fO.name === "secret.txt") { pendingFileContent = fO.content; newPrompt("filePassword"); return true; } else { printLine(fO.content || "Leere Datei."); return false; } }
      function clearTerminal() { terminal.innerHTML = ""; }
      function getCurrentPathString() { const pN = currentPath.map(o => o.name); return "/" + pN.slice(1).join("/"); }
      function findChildDirectory(name) { const d = currentPath[currentPath.length - 1]; return d.children?.find(c => c.name === name && c.type === "directory"); }
      function printLine(text) { const l = document.createElement("div"); l.textContent = text; terminal.appendChild(l); terminal.scrollTop = terminal.scrollHeight; }
    }
  </script>
</body>
</html>
